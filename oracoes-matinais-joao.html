<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orações Matinais — Evangelho Segundo João</title>
<style>
  :root {
    --green: #1a6b35;
    --green-light: #2a8a48;
    --green-pale: #e8f5ec;
    --green-tab: #c8e6d0;
    --gold: #c9a227;
    --fs: 20px;
    --lh: 1.8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { font-size: var(--fs); }

  body {
    font-family: 'Georgia', 'Charter', 'Palatino Linotype', 'Book Antiqua', serif;
    background: #fafaf8;
    color: #1a1a1a;
    line-height: var(--lh);
    min-height: 100vh;
  }

  /* ─── HEADER ─── */
  .site-header {
    background: var(--green);
    color: #fff;
    text-align: center;
    padding: 2.2rem 1.5rem 1.8rem;
    border-bottom: 4px solid #145528;
  }
  .site-header h1 {
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 0.25rem;
  }
  .site-header p {
    font-size: 0.85rem;
    opacity: 0.85;
    font-style: italic;
    letter-spacing: 0.04em;
  }

  /* ─── FONT CONTROLS ─── */
  .font-controls {
    position: fixed;
    top: 1rem;
    right: 1rem;
    display: flex;
    gap: 0.35rem;
    z-index: 1000;
  }
  .font-btn {
    background: rgba(26,107,53,0.92);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 2.1rem;
    height: 2.1rem;
    font-size: 1rem;
    font-family: 'Georgia', serif;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    transition: background 0.15s;
    line-height: 1;
  }
  .font-btn:hover { background: rgba(26,107,53,1); }

  /* ─── CHAPTER TABS ─── */
  .tabs-wrapper {
    background: #f0f0ee;
    border-bottom: 2px solid #ddd;
    position: sticky;
    top: 0;
    z-index: 100;
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--green) transparent;
    -webkit-overflow-scrolling: touch;
  }
  .tabs-wrapper::-webkit-scrollbar { height: 4px; }
  .tabs-wrapper::-webkit-scrollbar-track { background: transparent; }
  .tabs-wrapper::-webkit-scrollbar-thumb { background: var(--green); border-radius: 2px; }

  .tabs {
    display: flex;
    gap: 0.35rem;
    padding: 0.55rem 0.8rem;
    min-width: max-content;
  }
  .tab-btn {
    background: #e2e2df;
    border: 1px solid #ccc;
    border-radius: 999px;
    padding: 0.28rem 0.85rem;
    font-size: 0.72rem;
    font-family: 'Georgia', serif;
    font-weight: 600;
    color: #444;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.18s;
    letter-spacing: 0.02em;
  }
  .tab-btn:hover {
    background: var(--green-tab);
    border-color: var(--green);
    color: var(--green);
  }
  .tab-btn.active {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
    box-shadow: 0 2px 6px rgba(26,107,53,0.3);
  }

  /* ─── MAIN CONTENT ─── */
  .main {
    max-width: 740px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 5rem;
  }

  /* ─── CHAPTER HEADING ─── */
  .chapter-heading {
    text-align: center;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--green);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 2.5rem 0 1.8rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid var(--green-tab);
  }

  /* ─── PERICOPE CARD ─── */
  .pericope {
    margin-bottom: 3.5rem;
    border-left: 3px solid var(--green-tab);
    padding-left: 1.5rem;
    transition: border-color 0.2s;
  }
  .pericope:hover { border-left-color: var(--green); }

  /* Reference */
  .ref-tag {
    display: inline-block;
    background: var(--green);
    color: #fff;
    font-size: 0.72rem;
    font-family: 'Georgia', serif;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 0.2rem 0.75rem;
    border-radius: 999px;
    margin-bottom: 1rem;
    text-transform: uppercase;
  }

  /* Biblical quote */
  .quote-block {
    font-size: 1.05rem;
    font-style: italic;
    color: #2a3a2a;
    line-height: 1.7;
    margin-bottom: 1.5rem;
    padding: 1rem 1.4rem;
    background: var(--green-pale);
    border-left: 4px solid var(--green);
    border-radius: 0 6px 6px 0;
  }

  /* Commentary */
  .commentary {
    font-size: 1rem;
    line-height: var(--lh);
    color: #292929;
    margin-bottom: 1.6rem;
  }
  .commentary p { margin-bottom: 1rem; }
  .commentary p:last-child { margin-bottom: 0; }

  /* Prayer */
  .prayer-block {
    background: #111d14;
    color: #e8d8a0;
    padding: 1.4rem 1.6rem;
    border-radius: 8px;
    font-size: 0.95rem;
    line-height: 1.75;
    margin-bottom: 1rem;
    box-shadow: 0 3px 12px rgba(0,0,0,0.18);
  }
  .prayer-block p { margin-bottom: 0.9rem; }
  .prayer-block p:last-child { margin-bottom: 0; }
  .prayer-label {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #7ab88a;
    margin-bottom: 0.75rem;
    display: block;
  }

  /* Author */
  .author {
    font-size: 0.78rem;
    color: #888;
    font-style: italic;
    text-align: right;
    letter-spacing: 0.04em;
  }

  /* ─── SEARCH ─── */
  .search-bar {
    display: flex;
    gap: 0.5rem;
    padding: 0.7rem 1rem;
    background: #fff;
    border-bottom: 1px solid #e0e0de;
  }
  .search-bar input {
    flex: 1;
    border: 1px solid #ccc;
    border-radius: 999px;
    padding: 0.45rem 1rem;
    font-size: 0.85rem;
    font-family: 'Georgia', serif;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: var(--green); }
  .search-count {
    font-size: 0.75rem;
    color: #888;
    align-self: center;
    white-space: nowrap;
  }

  /* ─── EMPTY STATE ─── */
  .empty-state {
    text-align: center;
    color: #999;
    font-style: italic;
    padding: 4rem 2rem;
    font-size: 0.9rem;
  }

  /* ─── FOOTER ─── */
  .site-footer {
    background: var(--green);
    color: rgba(255,255,255,0.7);
    text-align: center;
    font-size: 0.72rem;
    padding: 1.2rem;
    letter-spacing: 0.04em;
  }

  @media (max-width: 600px) {
    .main { padding: 1.5rem 1rem 4rem; }
    .site-header h1 { font-size: 1.3rem; }
    .pericope { padding-left: 1rem; }
  }
</style>
</head>

  <button class="font-btn" onclick="changeFontSize(-1)" title="Diminuir fonte">A−</button>

</div>

</header>

<div class="tabs-wrapper">

  </div>
</div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="Buscar por referência, texto ou palavra..." oninput="onSearch()">
  <span class="search-count" id="searchCount"></span>
</div>

<main class="main" id="main">
  <div class="empty-state">Carregando...</div>
</main>

<footer class="site-footer">
  Série Orações Matinais — Evangelho Segundo João &nbsp;|&nbsp; Arisvaldo Marinho Cunha
</footer>

<script>
const DATA = [
{"ref":"João 1:1","chapter":1,"quote":"No princípio era o Verbo, e o Verbo estava com Deus, e o Verbo era Deus.","commentary":"Antes do tempo existir — antes mesmo do princípio de todas as coisas como as conhecemos — Cristo já era plenamente divino. E quando tudo passar, Ele ainda será eternamente Deus em Sua plenitude. Em tempos de pressa e confusão, João nos convida a voltar ao princípio — não apenas ao início da criação, mas ao coração da eternidade. Ali, antes do tempo e da matéria, estava o Verbo: eterno, autoexistente e possuidor inquestionável da natureza divina — \"o Verbo era Deus\". Antes que o tempo contasse seus dias, o Verbo já existia — pleno em vida, abundante em glória. Ele não foi criado, nem surgiu em algum ponto da história. Ele estava com Deus — em perfeita comunhão, em glória eterna. O mundo pode ser abalado, as estruturas humanas podem falhar, mas há uma Palavra que permanece. Não uma ideia — mas uma Pessoa: Jesus Cristo, o Verbo eterno, é o Deus imutável que criou todas as coisas e sustenta cada instante com o poder da Sua voz. Conhecê-Lo não é acumular doutrina, mas submeter-se à realidade maior: o Deus eterno que se fez carne e habitou entre nós. O mesmo Verbo que estava no princípio nos chama hoje a adorá-Lo, crer n'Ele e descansar em Sua presença viva. O Verbo é Deus. O Verbo vive. E toda existência se curva diante d'Aquele que é, que era, e que há de vir.","prayer":"Ó Maravilhoso e Bom Jesus, Eterno e Soberano Cordeiro! Antes das eras e de todos os tempos Tu já existias — pleno em glória e poder. Antes que houvesse começo, antes que as primeiras coisas criadas viessem à existência, Tu eras — e continuas sendo — a Vida Abundante, a Palavra Viva, o esplendor da eternidade. Concede aos Teus seguidores o descanso na certeza da Tua existência eterna, pois Tu és o Verbo que existe, reina — e nos chama para Si. Dá-nos um coração, reverente e fiel, que contemple a Tua Glória, ó Imaculado Cordeiro. Ensina-nos a viver de joelhos diante de Ti, ó Verbo que vive. Ajuda-nos a caminhar sob Tua Palavra e a proclamar, com toda a criação: Tu és Deus — ontem, hoje e sempre."},
{"ref":"João 1:2-3","chapter":1,"quote":"Ele estava no princípio com Deus. Todas as coisas foram feitas por intermédio dele, e, sem ele, nada do que foi feito se fez.","commentary":"Muito antes de qualquer começo, quando o tempo ainda era silêncio, o Verbo já estava com Deus — pleno, divino, eterno. Ele não foi espectador da criação, mas seu Autor: \"Todas as coisas foram feitas por intermédio dele\" [João 1:3]. O universo, a ordem, a vida — tudo veio à existência porque Ele disse: \"Haja\". Nada escapou de Suas mãos: \"sem Ele, nada do que foi feito se fez\". Cristo é mais que origem. Ele é estrutura, sustento e sentido. E quando a alma se curva diante da dor ou do caos, somos lembrados: Cristo, o Criador Divino, conhece nossa estrutura, pois foi Ele quem a formou. O Verbo é o Alfa da criação — e o Sustentador da existência. Ele é Deus. Ele é Vida. Ele é o princípio — e permanece para sempre.","prayer":"Ó Maravilhoso e Bom Jesus, Eterno e Soberano Cordeiro! Antes das eras e de todos os tempos Tu já existias — pleno em glória e poder. Antes que houvesse começo, antes que as primeiras coisas criadas viessem à existência, Tu eras — e continuas sendo — a Vida Abundante, a Palavra Viva, o esplendor da eternidade. Concede aos Teus seguidores o descanso na certeza da Tua existência eterna, pois Tu és o Verbo que existe, reina — e nos chama para Si. Dá-nos um coração, reverente e fiel, que contemple a Tua Glória, ó Imaculado Cordeiro. Ensina-nos a viver de joelhos diante de Ti, ó Verbo que vive. Ajuda-nos a caminhar sob Tua Palavra e a proclamar, com toda a criação: Tu és Deus — ontem, hoje e sempre."},
{"ref":"João 1:4-5","chapter":1,"quote":"A vida estava nele e a vida era a luz dos homens. A luz resplandece nas trevas, e as trevas não prevaleceram contra ela.","commentary":"A luz que brilha a partir do Verbo não pode ser vencida. Nenhuma escuridão — histórica, espiritual, política ou pessoal — poderá jamais apagar a luz maravilhosa que irradia de Cristo. Ele é soberano em poder: a vida vence a morte, a luz dissipa as trevas, e a esperança ressurge mesmo nos vales mais sombrios. João nos conduz à origem de tudo e afirma: \"A vida estava nele\" [João 1:4] — não uma centelha tímida e vacilante, mas a fonte absoluta da existência: Eterna, Autossuficiente e Divina. Essa vida é a luz dos homens —verdade que revela o caminho, esperança que guia, direção para os que estão cansados na escuridão. \"A luz resplandece nas trevas, e as trevas não prevaleceram contra ela\" [João 1:5]. O mundo mergulhou em trevas — mas a Palavra permaneceu como Luz triunfante. Mesmo atacada, a Luz Divina triunfou. Ela não apenas existe — ela consola, desperta, conduz. Essa luz é Cristo. Mais forte que a morte. Mais reluzente que o sol. Mais poderoso que a mais tenebrosa escuridão.","prayer":"Ó Cristo, Luz Eterna que dissipa as trevas! Tu és a Fonte da Vida que jamais se apaga, a Palavra Viva que alimenta a alma com a luz da Tua Glória. Nenhuma escuridão pode sufocar a Tua chama. A Tua luz, ó Cristo, não apenas brilha — ela cura, penetra e transforma. Ilumina nossos passos com o esplendor da Tua Verdade. Que nossas palavras, pensamentos e ações reflitam o Teu brilho santo. Faz da nossa vida um testemunho vivo da Tua vitória sobre as trevas. E quando o mundo se cobrir em sombras, guia-nos sob o fulgor da Tua Luz que não se apaga. Ó Bendito Cordeiro, Tu és a aurora fiel no coração dos que confiam em Ti."},
{"ref":"João 1:6-7","chapter":1,"quote":"Houve um homem enviado por Deus cujo nome era João. Este veio como testemunha para que testificasse a respeito da luz, a fim de todos virem a crer por intermédio dele.","commentary":"Em um mundo sedento por luz, Deus levanta vozes que apontam para o Cristo. João Batista não veio para brilhar por si, mas para ser testemunha — uma seta viva que indica a direção da Luz verdadeira. Ele não era a luz — mas sua vida resplandecia com lampejos santos. João Batista foi \"um homem enviado por Deus\" [João 1:6]. Veio com uma missão. Veio com um propósito. Veio para testificar da luz, \"a fim de todos virem a crer por intermédio dele\" [João 1:7]. Era apenas homem — mas enviado. Apenas servo — mas fiel. Viveu para abrir os corações e anunciar a esperança. Mas o centro do Evangelho não é o homem — é Cristo. A luz é Cristo. A glória é de Cristo. A missão de João é também a da Igreja: ser voz que proclama, vida que aponta, servo que prepara. Há um lugar na história da salvação para os que, embora não sejam a luz, vivem para anunciá-la.","prayer":"Ó Jesus Maravilhoso, Luz Verdadeira que vinda ao mundo brilha sobre todo coração! Levanta em nossos dias vozes que não vivam para si, mas para anunciar a Tua Glória e o Teu Nome incomparável. Que os Teus servos, ó Cristo Bendito, sejam fiéis, consagrados ao ministério de preparar corações e proclamar a esperança. Que nenhuma alma busque tornar-se o centro das atenções — mas que toda vida revele, com humildade e fervor, a luz que emana de Ti. Pois Tu és a Luz que jamais se apaga — e em Ti resplandece toda a salvação."},
{"ref":"João 1:8-9","chapter":1,"quote":"Ele não era a luz, mas veio para que testificasse da luz, a saber, a verdadeira luz, que, vinda ao mundo, ilumina a todo homem.","commentary":"Em um tempo de vozes competem por atenção, é vital reconhecer aquela que com fidelidade aponta para a Verdade. João Batista não era a luz — era testemunha fiel. Não buscava glória. Não desejava aplausos. Sua vida era uma seta viva, uma voz consagrada, um servo do Altíssimo. Ele anunciava \"a verdadeira luz, que, vinda ao mundo, ilumina a todo homem\" [João 1:9]. Essa luz é Cristo. Não uma luz fraca ou distante — mas luz plena, viva, acessível. Jesus veio para redimir os que caminham nas sombras. Veio para dissipar o medo, curar a dor, conduzir à Vida Eterna. Hoje, Cristo ainda ilumina. Ainda dissipa trevas. Ainda chama corações. Que a vida dos que creem não busque brilho próprio, mas reflita fielmente Aquele que é a Luz Verdadeira, Eterna e Divina.","prayer":"Ó Cristo, Luz Verdadeira e Centro de toda Glória! Tu és o Verbo Divino que ilumina cada alma. Tu levantas vozes que não busquem aplauso, mas vivem para exaltar o Teu Nome, ó Cordeiro Santo. Faz de nós, Senhor, mais que ouvintes — faz de nós testemunhas fiéis. Que o nosso viver seja estrada santa por onde a Tua luz alcance corações em sombras. Ensina-nos a alegria de sermos uma seta que conduz ao esplendor do Teu nome. Que sejamos fiéis em anunciar a Tua Luz diante de todos. E quando nossas palavras cessarem, que a nossa vida continue pregando: Cristo é a Luz — e n'Ele brilha toda a esperança."},
{"ref":"João 1:10-11","chapter":1,"quote":"O Verbo estava no mundo, o mundo foi feito por intermédio dele, mas o mundo não o conheceu. Veio para o que era seu, e os seus não o receberam.","commentary":"O paradoxo da história humana é este: o Criador veio ao mundo — e o mundo não O reconheceu. A Majestade Eterna vestiu-se de carne. Aquele por quem todas as coisas foram feitas pisou o chão que Suas mãos moldaram. Mas os corações estavam cegos, endurecidos pela incredulidade. E os Seus, que deveriam recebê-Lo com honra, O rejeitaram com indiferença. João 1:10-11 revela a dor do amor ignorado. O Verbo que criou tudo entrou em Sua própria criação — não como juiz, mas como Salvador. Veio para os Seus. Mas os Seus O desprezaram. Contudo, Seu amor não recua. Ele não desiste. Pois a Luz verdadeira continuará brilhando para sempre. A Graça não foi vencida. Ele veio por amor — e amou até o fim. Cristo conhece o gosto da rejeição — e mesmo assim, estende a mão aos que ainda O ignoram.","prayer":"Ó Cristo Glorioso, que amas mesmo tendo sido rejeitado! Tu conheces o amargo gosto da rejeição, mas o Teu Amor permanece: puro, firme e invencível. Ensina-nos a reconhecer-Te no meio da rotina, a não desprezar-Te quando estiveres visitando a nossa alma. Que não sejamos insensíveis à Tua presença, nem frios diante do Teu Amor. Recebe hoje o lugar que Te é devido — não à margem, mas no centro. Não como hóspede, mas como Senhor."},
{"ref":"João 1:12-13","chapter":1,"quote":"Mas, a todos quantos o receberam, deu-lhes o poder de serem feitos filhos de Deus, a saber, aos que creem no seu nome; os quais não nasceram do sangue, nem da vontade da carne, nem da vontade do homem, mas de Deus.","commentary":"Quando o Criador entrou no mundo, o mundo não O reconheceu. Ele veio para os Seus — mas os Seus O rejeitaram [João 1:10-11]. A dor da rejeição é real, mas não foi o fim. A Luz não recuou. A Graça não cessou. O Verbo eterno, ainda não reconhecido, permaneceu oferecendo o dom da vida aos que O receberiam. \"Receber\" não é apenas notar Sua presença — é acolher com fé, crer com o coração e entregar-se com confiança. É crer no Nome que salva, reina e transforma. E aos que assim O recebem, Ele dá o direito de serem feitos filhos de Deus [João 1:12]. O Amor foi rejeitado — mas não derrotado. Cristo continua vindo. Ainda hoje, Ele bate à porta. E àqueles que O recebem, Ele concede nova identidade, novo nascimento, nova esperança. Porque a Luz verdadeira, mesmo quando ignorada, jamais deixa de brilhar.","prayer":"Ó Verbo Eterno, que vieste ao mundo em busca dos que estavam perdidos. Mesmo rejeitado, Teu amor não recuou. Mesmo ignorado, permaneceste amando. Desprezado — mas ainda assim, vieste para salvar. Hoje, pela Tua Graça e Misericórdia, queremos receber-Te — não com indiferença, mas com fé viva, coração desperto e alma rendida. Abre os nossos olhos à Tua presença. Dissolve toda resistência. Concede-nos, ó Cristo, a Graça de crer no Teu Nome — não apenas com os lábios, mas com uma vida consagrada a Ti. Faz de nós filhos da Luz, herdeiros do Reino, testemunhas do Teu amor invencível."},
{"ref":"João 1:14","chapter":1,"quote":"E o Verbo se fez carne e habitou entre nós, cheio de graça e de verdade, e vimos a sua glória, glória como do unigênito do Pai.","commentary":"Quando Deus quis nos tocar, Ele não enviou um conceito — veio em Pessoa: Jesus Cristo. O Verbo eterno atravessou os véus da eternidade, percorreu a imensurável distância entre o Céu e a Terra e entrou, de forma definitiva, na nossa história. Não veio com exércitos ou espetáculo, mas com pele, lágrimas e glória. Ele não falou de longe — habitou entre nós. E vimos a Sua glória. Não uma glória feita de ouro ou poder político, mas visível na mansidão, na cura, na verdade que liberta e na graça que abraça — Deus caminhando conosco. Cheio de Graça e Verdade. Graça que restaura. Verdade que confronta e salva. Em Jesus, a fidelidade do Pai ganhou rosto, gesto e voz. A encarnação é o milagre da proximidade divina. Ele não é apenas o Deus que vê — é o Deus que vem, que habita conosco e transforma a nossa história. Que o Cristo encarnado seja o centro do nosso louvor e a manifestação suprema da nossa esperança.","prayer":"Ó Verbo Encarnado, Presença divina e gloriosa entre nós! Tu, que vieste com pele e lágrimas, habitando nossa humanidade, sê para nós abrigo e luz neste dia. Não vieste com poder terreno, mas com Graça que acolhe e Verdade que liberta. Faz-nos reconhecer-Te nas coisas simples — no toque, no pranto, no pão repartido. Que a Tua glória, revelada em mansidão, desperte em nós piedosa reverência. Que a Tua Palavra viva transforme a nossa carne frágil em templo da Tua habitação. Habita em nós, ó Cristo Eterno. E que sejamos profundamente transformados por Tua Glória e Verdade."},
{"ref":"João 1:15","chapter":1,"quote":"João testemunha a respeito dele e exclama: Este é o de quem eu disse: o que vem depois de mim tem, contudo, a primazia, porquanto já existia antes de mim.","commentary":"Toda voz que verdadeiramente serve ao Reino aponta para Alguém maior: Cristo, o Soberano Rei do Universo. O centro não é o arauto — é o Imaculado Cordeiro de Deus. O conteúdo da mensagem será sempre mais eloquente do que a voz do mensageiro. Quando João Batista testemunhava no deserto, não buscava glória para si — anunciava Jesus, o Outro Maior, eternamente superior. Ele não se colocou no centro, mas apontou para o Cordeiro. Embora seu ministério tenha começado antes no tempo, João reconheceu que Jesus, ainda que tenha iniciado o Seu ministério depois, já existia antes dele — Eterno, Soberano, Glorioso. Cristo tem, portanto, a primazia, porque Ele é o Verbo pré-existente a tudo e a todos. O Verbo encarnado não é fruto da história — é Senhor sobre ela. Na jornada da fé, Cristo é maior. Cristo é primeiro. Cristo é eterno.","prayer":"Maravilhoso Jesus, Cristo Eterno, Verbo vivo antes do tempo e Senhor acima da história! Sê exaltado ó Cordeiro Glorioso e Rei soberano. Ensina-nos a ser testemunhas fiéis — voz que aponta, servo que cede, coração que Te glorifica. Livra-nos da vaidade de querermos o centro, e concede-nos a graça de viver como arautos fiéis do Teu Reino. Seja a nossa vida um eco do Teu Nome, um altar que proclama: Cristo é maior. Cristo é primeiro. Cristo é eterno. Recebe, ó Cristo glorificado, o lugar que é Teu — no púlpito, no coração, na história e na eternidade."},
{"ref":"João 1:16-18","chapter":1,"quote":"Porque todos nós temos recebido da sua plenitude e graça sobre graça. Porque a lei foi dada por intermédio de Moisés; a graça e a verdade vieram por meio de Jesus Cristo. Ninguém jamais viu a Deus; o Deus unigênito, que está no seio do Pai, é quem o revelou.","commentary":"Quando a plenitude do tempo chegou, a Graça e a Verdade — como um rio cristalino e caudaloso — jorraram d'Aquele que é Senhor do tempo e do coração. A Lei, gloriosamente entregue por Moisés, apontava para o céu, sem, no entanto, revelá-lo plenamente. Mas em Cristo, o Imaculado Cordeiro, o Céu veio até nós. Nele, a Graça se tornou visível e a Verdade, palpável. Não se trata de anular a Lei, mas de cumpri-la em perfeição: a Lei mostrou o ideal; Cristo o encarnou totalmente — com Sua vida, morte e ressurreição. Ninguém jamais viu a Deus — até que o Filho unigênito O revelou. Nele, o invisível se fez próximo. E da Sua plenitude, seguimos recebendo: graça sobre graça — não por mérito, mas por dom. Na plenitude do Verbo, a Graça continua fluindo. E por Ele, a humanidade finalmente vê Deus.","prayer":"Ó Cristo Glorioso, Pleno em Graça e resplandecente em Verdade, em Ti o Céu se aproximou dos nossos corações sedentos. Da Tua plenitude jorra vida, cura e redenção. Não há mérito em nós — nem mesmo na fé — mas recebemos dom sobre dom, graça sobre graça. Faz-nos sensíveis ao Teu agir, atentos à Tua presença, rendidos à Verdade que salva e transforma. Revela-nos o Pai, ó Unigênito Filho de Deus, cheio de graça e verdade. Que na nossa fraqueza, Tua Graça transborde. Que nos nossos dias, Tua Verdade permaneça. Que na nossa história, Tua Glória resplandeça."},
{"ref":"João 1:19-24","chapter":1,"quote":"Este foi o testemunho de João, quando os judeus lhe enviaram de Jerusalém sacerdotes e levitas para lhe perguntarem: Quem és tu? Ele confessou [\\...] Eu não sou o Cristo. Então, lhe perguntaram: Quem és, pois? És tu Elias? Ele disse: Não sou. És tu o profeta? Respondeu: Não. Disseram-lhe, pois: Declara-nos quem és, [\\...] que dizes a respeito de ti mesmo? Então, ele respondeu: Eu sou a voz do que clama no deserto: Endireitai o caminho do Senhor, como disse o profeta Isaías. Ora, os que haviam sido enviados eram de entre os fariseus.","commentary":"A alma que sabe quem é — e, sobretudo, quem não é — livra-se da sede por aplausos e torna-se apta a glorificar somente a Cristo. Quando os líderes religiosos perguntaram a João Batista: \"Quem és tu?\" [João 1:19-24], ele respondeu com coragem e humildade: \"Não sou o Cristo. Nem Elias. Nem o Profeta.\" João não se definia por títulos, mas por missão. Era voz, e não verbo. Arauto, e não Rei. Não buscou honra, mas preparou o caminho. Não desejou protagonismo, mas apontou o Cordeiro. Em sua boca, não havia vanglória — havia fidelidade. Em sua missão, não havia ambição — havia obediência. Ser voz é suficiente quando Cristo é a Palavra. Ser ponte é suficiente quando Jesus é o Caminho. Que a nossa vida seja o deserto que prepara, a voz que proclama e o chão que aponta para Cristo.","prayer":"Senhor Jesus, Cordeiro de Deus e Centro de toda glória, ensina-nos a ser voz — e a não viver em busca de palco. Livra-nos do desejo de reconhecimento e firma nossa identidade no Teu chamado. Que não busquemos títulos, mas fidelidade. Que não desejemos aplausos, mas a honra de proclamar o Teu caminho. Faz de nós pontes que apontam ao Teu Coração, lugares que desfrutam da Tua presença, ecos que anunciem a Tua chegada."},
{"ref":"João 1:25-27","chapter":1,"quote":"E perguntaram-lhe: Então, por que batizas, se não és o Cristo, nem Elias, nem o profeta? Respondeu-lhes João: Eu batizo com água; mas, no meio de vós, está quem vós não conheceis, o qual vem após mim, do qual não sou digno de desatar-lhe as correias das sandálias.","commentary":"É de inimaginável tristeza e imensurável fracasso ser contemporâneo da presença de Jesus e, ainda assim, não conseguir discerni-la. João pregava no deserto, batizava multidões, e o Cristo já estava ali — presente, real, próximo. Mas os olhos de muitos estavam cegos pela arrogância espiritual. \"Entre vós está quem vós não conheceis [\\...]\" [João 1:26]. Que tragédia maior do que ter a Glória ao alcance — e não perceber o Seu radiante brilho? João não reivindica títulos. Não se protege com status. Não se exalta como profeta. Ele apenas aponta. E se curva: \"Não sou digno de desatar-Lhe as correias das sandálias\" [João 1:27]. Essa declaração carrega mais do que humildade — é consciência santa. É a reverência de quem sabe que estar diante do Cordeiro é graça imerecida. A Luz já brilhava. Mas os olhos do farisaísmo judaico estavam opacos. O Salvador já havia chegado, mas Seus passos não foram ouvidos entre os fariseus. Hoje, essa voz ainda clama: Cristo está entre nós. O Verbo habita no meio do Seu povo. E a maior dignidade da vida é viver para desatar, ao longo do caminho, as correias das Suas sandálias.","prayer":"Ó Amado e Bom Jesus, invisível aos olhos soberbos, mas gloriosamente presente entre os humildes! Tu estás em nosso meio — e, ainda assim, quantas vezes Te ignoramos! Perdoa-nos por caminhar sem reconhecer-Te, por ouvir sem escutar-Te, por viver sem glorificar-Te. Concede-nos olhos que vejam a Tua presença, mesmo quando oculta na simplicidade. Dá-nos coração quebrantado, sensível ao Teu andar silencioso entre nós. Livra-nos da arrogância que obscurece a fé. Que o nosso privilégio seja anunciar a Tua Majestosa Presença. E que toda a nossa vida seja um altar que proclama: o Cordeiro já está entre nós!"},
{"ref":"João 1:28-31","chapter":1,"quote":"Estas coisas se passaram em Betânia, do outro lado do Jordão, onde João estava batizando. No dia seguinte, viu João a Jesus, que vinha para ele, e disse: Eis o Cordeiro de Deus, que tira o pecado do mundo! É este a favor de quem eu disse: após mim vem um varão que tem a primazia, porque já existia antes de mim. Eu mesmo não o conhecia, mas, a fim de que ele fosse manifestado a Israel, vim, por isso, batizando com água.","commentary":"Em meio às águas do Jordão, uma voz se levantou — não para chamar atenção para si mesmo, mas para apontar Aquele que veio que veio para redimir o mundo. João Batista viu Jesus se aproximar, e mesmo sem tê-Lo conhecido antes, seus olhos se abriram e seu lábios proclamaram com fé: \"Eis o Cordeiro de Deus, que tira o pecado do mundo\" [João 1:29]. Essa declaração não é poética — é profética. João revelou a missão do Majestoso Cristo: carregar o peso do nosso pecado e oferecer redenção plena. Ao anunciar isso publicamente, ele declarou a supremacia de Jesus sobre todos os mensageiros, profetas e ritos. O batismo anunciava arrependimento, mas o Cordeiro traria reconciliação, pois Ele é o verdadeiro e único caminho para a reconciliação com Deus. Hoje, essa proclamação ainda ecoa: reconhecer a Cristo é abraçar a Graça que purifica e o Amor que transforma. A soberania do Cordeiro permanece — Ele é o único que tira o pecado e inaugura a nova criação.","prayer":"Louvado seja o Teu Nome, ó Supremo Jesus, Tu, que pela Graça, mediante a fé, és poderoso para destronar o pecado que nos afasta de Ti. Com amor único e sacrificial, Tu Te aproximas, mesmo quando ainda não Te reconhecemos, e caminhas ao nosso encontro antes mesmo que Te busquemos. Que os nossos olhos contemplem Tua Presença, ó Majestoso Cristo, e que o nosso coração se renda a Ti em contrição verdadeira. Que todo o nosso ser Te exalte. Que os nossos olhos vejam Tua face exaltada, e que os nossos lábios proclamem — com fervor e fidelidade — a salvação que vem de Ti."},
{"ref":"João 1:32-34","chapter":1,"quote":"E João testemunhou, dizendo: Vi o Espírito descer do céu como pomba e pousar sobre ele. Eu não o conhecia; aquele, porém, que me enviou a batizar com água me disse: Aquele sobre quem vires descer e pousar o Espírito, esse é o que batiza com o Espírito Santo. Pois eu, de fato, vi e tenho testificado que ele é o Filho de Deus.","commentary":"Só quem renuncia ao centro pode apontar com clareza para o verdadeiro Salvador. João Batista não buscou glória para si. Seu primeiro testemunho foi uma negativa cuidadosamente articulada: Não sou o Cristo, nem Elias, nem o Profeta Prometido [João 1:19--21]. Ele sabia quem não era. Sabia que sua missão era preparar o caminho. Agora, ele levanta os olhos e declara: \"Vi o Espírito descer do céu como pomba e pousar sobre ele [\\...] ele é o Filho de Deus\" [João 1:32--34]. Quem não usurpou o centro, agora proclama com fé: \"Eis o Cordeiro de Deus.\" Seu \"não sou\" abre espaço para o \"Ele é\". A descida do Espírito Santo foi mais que um sinal — foi a confirmação do céu: o Pai falou, o Espírito desceu e o Filho foi revelado. A Trindade manifesta. João, o que disse \"não sou digno\", tornou-se a voz que revelou o Glorioso Messias. Esse texto é um majestoso convite para negar-se a si mesmo e afirmar com fé quem é Aquele que transforma o mundo. A vida que se esvazia de si encontra sua maior plenitude ao dizer com reverência: Eis o Cordeiro de Deus.","prayer":"Ó Cordeiro Santo, Filho do Deus Vivo, Tu és Aquele sobre quem repousa o Santo Espírito de Deus. Livra-nos da ânsia por glória humana — e concede-nos a graça de proclamar, com voz serena e firme: \"Eis o Cordeiro de Deus.\" Faz-nos humildes para declarar: \"Eu não sou o centro\". E dá-nos coragem para reconhecer diante de todos, que \"Tu és o Soberano Senhor do universo\". Enche-nos com Teu Espírito, para que sejamos testemunhas fiéis, cuja vida proclama, com alegria e reverência: Cristo é o Salvador do mundo."},
{"ref":"João 1:35-37","chapter":1,"quote":"No dia seguinte, estava João outra vez na companhia de dois dos seus discípulos e, vendo Jesus passar, disse: Eis o Cordeiro de Deus! Os dois discípulos, ouvindo-o dizer isto, seguiram Jesus.","commentary":"A missão termina bem quando o coração aceita ser ponte, e não destino. João Batista viu Jesus vindo ao seu encontro, conforme João 1:29 — e depois, tornou a vê-lo, porém, caminhando para outra direção, de acordo com João 1:36. Em ambos os momentos, o testemunho de João a respeito de Jesus foi o mesmo: \"Eis o Cordeiro de Deus\". Ele não apenas reconheceu o Messias. Renunciou a tudo por causa d'Ele — até mesmo aos seus discípulos. Tão logo ouviram o testemunho de João sobre Jesus, dois dos seus discípulos imediatamente seguiram o Messias Prometido. Esse é o legado de um servo fiel: apontar para Cristo até que outros O sigam. E então, sair de cena com alegria. A fé que se alegra em perder o centro é a fé que prepara o caminho do Senhor — e frutifica para a eternidade.","prayer":"Ó Cordeiro de Deus, Tu és a prova definitiva, maravilhosa e sublime do amor do Pai Celestial por nós. Livra-nos da tentação de reter discípulos para nós mesmos — e dá-nos o privilégio de conduzi-los até Ti. Dá-nos um coração que proclama o Teu Nome, o Teu Reino e a Tua Soberania com fidelidade, amor e devoção. Que a nossa alegria seja esta: perder o centro, para que em tudo a Tua Majestade seja exaltada. E que o nosso coração se mantenha fiel à eterna declaração: Tu és o Cordeiro de Deus."},
{"ref":"João 1:38-39","chapter":1,"quote":"E Jesus, voltando-se e vendo que o seguiam, disse-lhes: — O que vocês estão procurando? Eles disseram: — Rabi, onde o senhor mora? (\\\"Rabi\\\" quer dizer \\\"Mestre\\\".) Jesus respondeu: — Venham ver! Então eles foram, viram onde Jesus estava morando e ficaram com ele aquele dia. Eram mais ou menos quatro horas da tarde.","commentary":"Toda verdadeira caminhada com Cristo começa quando a alma deixa de buscar respostas e passa a desejar presença e relacionamento. Jesus se volta para os que O seguem e, com olhos que sondam o mais íntimo do ser, pergunta: \"O que vocês estão procurando?\" [João 1:38]. Não era um convite ao debate, mas à decisão —a chance de transformar curiosidade em comunhão. Eles respondem com outra pergunta: \"Rabi, onde o senhor mora?\" — revelando que o que desejavam não era explicação, mas convivência. E Jesus os acolhe com um convite eterno: \"Venham ver\" [João 1:39]. E eles foram. E ficaram com ele aquele dia. A presença de Jesus redefiniu aquela tarde — e para sempre, suas vidas. A verdadeira comunhão começa quando respondemos ao convite do Cordeiro, não com argumentos, mas com passos que O seguem.","prayer":"Ó Maravilhoso Jesus, para cada pergunta que Te fazemos, Tu respondes com presença, direção e comunhão. Desarma a pressa do nosso coração, e concede-nos a serenidade da pausa, para que Te sigamos — e permaneçamos contigo. Livra-nos da ansiedade que busca explicações, e forma em nós um amor que anseia por Tua presença. Que o Teu convite por relacionamento ecoe em nossa alma, até que nossos passos se tornem permanência e nossa jornada, comunhão. Louvado seja o Teu Nome, pois se receber bençãos de Ti já é milagre, estar contigo em comunhão é milagre ainda maior."},
{"ref":"João 1:40-42","chapter":1,"quote":"Era André, o irmão de Simão Pedro, um dos dois que tinham ouvido o testemunho de João e seguido Jesus. Ele achou primeiro o seu próprio irmão, Simão, a quem disse: Achamos o Messias (que quer dizer Cristo), e o levou a Jesus. Olhando Jesus para ele, disse: Tu és Simão, o filho de João; tu serás chamado Cefas (que quer dizer Pedro).","commentary":"A fé que arde no coração não se contenta em silenciar os lábios — ela corre para partilhar o que viu. André, impactado pelo encontro com o Cordeiro, e, num ato intencional e deliberado, foi logo procurar seu irmão Simão e lhe anunciou: \"Achamos o Messias\" [João 1:41]. Mas ele não parou nas palavras. O texto diz: \"e o levou a Jesus\". O verbo é denso e direto. André não apenas falou sobre Cristo — ele conduziu alguém até Cristo. E então, Jesus olhou para Simão e lhe deu um novo nome. O encontro com Jesus redefine identidade, vocação e destino. Mas tudo começou com alguém que decidiu compartilhar, conduzir e apresentar. A eficiência na missão de discipular nasce quando a alegria de ter encontrado o Cristo transborda em desejo de apresentá-lo a outros.","prayer":"Ó Maravilhoso e Bom Jesus, Messias Prometido. Louvado seja o Teu Nome, pois quando Te encontramos, Teu olhar penetra nossa alma e transforma nosso destino. Livra-nos da fé que se aquieta em si mesma, e forma em nós um amor que transborda em compromisso missionário. Que nossos passos não se detenham nas palavras, mas avancem com compaixão até que outros corações também Te encontrem. Redefine-nos com Teu Olhar, reconfigura-nos com Tua Graça, reposiciona-nos com Tua Soberana Vocação."},
{"ref":"João 1:43-45","chapter":1,"quote":"No dia imediato, resolveu Jesus partir para a Galiléia e encontrou a Filipe, a quem disse: Segue-me. Ora, Filipe era de Betsaida, cidade de André e de Pedro. Filipe encontrou a Natanael e disse-lhe: Achamos aquele de quem Moisés escreveu na lei, e a quem se referiram os profetas: Jesus, o Nazareno, filho de José.","commentary":"Toda fé que verdadeiramente encontra Cristo transforma-se em missão. Filipe foi chamado diretamente por Jesus [João 1:43] — e sua resposta foi imediata e relacional. Ele não reteve a alegria dessa revelação, mas saiu ao encontro de Natanael com uma proclamação carregada de esperança: \"Achamos aquele de quem Moisés escreveu na Lei, e a quem se referiram os profetas: Jesus, o Nazareno, filho de José\" [João 1:45]. Ele não explicou um conceito. Ele apresentou uma pessoa. Como André antes dele, Filipe torna-se ponte viva entre a fé e o próximo. O Cristo que o alcançou agora é anunciado com convicção — não como teoria, mas como realidade viva. A vocação cristã se completa quando nossa experiência se converte em testemunho. A missão floresce quando o coração evangelizado se recusa a se manter em silêncio e passa a caminhar como arauto do Reino até que outros também conheçam o Glorioso Cristo.","prayer":"Ó Cristo Eterno e Glorioso, Palavra Viva prometida na Lei e nos Profetas! Tu nos chamaste com voz de misericórdia — e, por Tua graça bendita, o nosso coração em chamas rendeu-se a Ti. Livra-nos da fé silenciosa e da alegria tímida que não se expressa entusiasmo. Que o tesouro da Tua revelação nos impulsione a correr como arautos do Teu Reino, proclamando com fervor: \"Achamos o Cristo!\" Faz dos nossos passos um convite à Tua presença. E das palavras dos nossos lábios, pontes vivas — para que outros Te vejam, Te sigam e sejam transformados por Ti."},
{"ref":"João 1:46-47","chapter":1,"quote":"Perguntou-lhe Natanael: De Nazaré pode sair alguma coisa boa? Respondeu-lhe Filipe: Vem e vê. Jesus viu Natanael aproximar-se e disse a seu respeito: Eis um verdadeiro israelita, em quem não há dolo!","commentary":"A fé floresce com brilho e vigor quando o coração que a abriga é honesto e verdadeiro — sem máscaras, sem disfarces, inteiramente rendido à luz da verdade diante de Deus. Natanael foi conduzido até Jesus, e o Majestoso Cristo revelou-lhe a biografia do coração com estas palavras: \"Eis um verdadeiro israelita, em quem não há dolo!\" [João 1:47]. A afirmação do Mestre contrastava com a dúvida inicial de Natanael: \"De Nazaré pode sair alguma coisa boa?\" [João 1:46]. Cada encontro com Cristo não é uma conferência de ideias, mas uma exposição de alma. É na transparência do ser que reconhecemos Aquele que já nos conhecia — e é nesse reconhecimento que recebemos uma nova história, um novo chamado, uma nova visão.","prayer":"Ó Cristo que tudo vê, Tu sondas os segredos do coração e a sabes quem somos antes mesmo de Ti encontrarmos. Louvado sejas, porque não desprezas os que chegam com dúvidas — mas acolhes com graça os que se aproximam com sinceridade. Livra-nos da dureza que julga pela aparência e forma em nós a transparência que Te agrada. Que sejamos achados por Ti com corações contritos e arrependidos — prontos para sermos redimidos pela Tua verdade. Que a nossa vida, diante de Ti, seja um altar sem véus, onde a Tua voz possa ecoar com liberdade, e a Tua presença nos transforme em nova criação."},
{"ref":"João 1:48-49","chapter":1,"quote":"Perguntou-lhe Natanael: Donde me conheces? Respondeu-lhe Jesus: Antes de Filipe te chamar, eu te vi, quando estavas debaixo da figueira. Então, exclamou Natanael: Mestre, tu és o Filho de Deus, tu és o Rei de Israel!","commentary":"Quando Cristo expõe o que ninguém contou ou contemplou, o coração enfim reconhece o Deus que tudo vê. Natanael chegou desconfiado, mas bastou uma frase para desmontar seu ceticismo: \"Antes de Filipe te chamar, eu te vi\" [João 1:48]. O olhar de Jesus atravessou os galhos de figueira e alcançou os segredos da alma de Natanael. Num instante, o Nazareno \"comum\" manifesta Sua Onisciência, e a incredulidade de Natanael curva-se em adoração: \"tu és o Filho de Deus, tu és o Rei de Israel!\" [João 1:49]. O Cristo que nos enxerga no esconderijo dos questionamentos converte a desconfiança em profunda rendição. Ele sabe exatamente onde a dúvida fez morada em nós e, ali mesmo, planta a certeza de uma nova identidade. Ser plenamente conhecido e, ainda assim, amado e compreendido, transforma ceticismo em confissão e faz o deserto da alma florescer sob a sombra do Cordeiro.","prayer":"Glorioso e Sublime Jesus, Teu Onisciente Olhar tudo vê — e nada Te é oculto! Torna sensível o nosso coração, para que as névoas da dúvida se desfaçam sob a luz das Tuas revelações. Louvamos Teu Precioso Nome, pois, mesmo conhecendo-nos por inteiro, Tu nos acolhes sob Tua poderosa mão. Que toda raiz de incerteza se desfaça e a nossa alma se firme na convicção de ser plenamente conhecida, amada e compreendida por Ti."},
{"ref":"João 1:50-51","chapter":1,"quote":"Ao que Jesus lhe respondeu: Porque te disse que te vi debaixo da figueira, crês? Pois maiores coisas do que estas verás. E acrescentou: Em verdade, em verdade vos digo que vereis o céu aberto e os anjos de Deus subindo e descendo sobre o Filho do Homem.","commentary":"A fé que nasce no primeiro encontro com Cristo não deve estacionar ali — ela é convidada a crescer, de graça em graça, rumo a \"coisas maiores\". Natanael ouviu de Jesus: \"Antes de Filipe te chamar, eu te vi\" [João 1:48]. Esta palavra foi suficiente para que se percebesse que o Nazareno penetra cada recanto do coração humano. O ceticismo caiu, e Natanael confessou: \"tu és o Filho de Deus, tu és o Rei de Israel!\" [João 1:49]. Mas Jesus abriu ainda mais o horizonte: \"vereis o céu aberto e os anjos de Deus subindo e descendo sobre o Filho do Homem.\" [João 1:51]. Cristo apresenta-se como a ponte viva entre o comum da terra e a glória do céu. A fé autêntica não se contenta com o primeiro sinal; ela avança até contemplar a plenitude do Reino de Deus — as \"coisas maiores\" que florescem à sombra do Cordeiro de Deus.","prayer":"Maravilhoso e Bom Jesus, ponte viva entre a terra e o céu. Teu Sublime olhar desfaz todo ceticismo e acende a chama da verdadeira fé. Conduze-nos, passo a passo, às \"coisas maiores\" que Tu preparaste para os filhos de Deus. Abre o céu sobre nós, revela Tua glória e faz-nos caminhar de graça em graça, de confissão em confissão, até que cada recanto do nosso coração pulse com a certeza de que Tu és o Filho de Deus, o Rei Eterno e Soberano!"},
{"ref":"João 2:3-5","chapter":2,"quote":"Três dias depois, houve um casamento em Caná da Galileia, achando-se ali a mãe de Jesus. Jesus também foi convidado, com os seus discípulos, para o casamento.\"\n\nJoão 2:1-2\n\nQuando a terra convida o céu, o comum se converte em palco de glória. O cenário era o de um casamento em Caná — mesa simples, risos de aldeia — e ali Jesus, com seus discípulos, toma lugar entre os comuns [João 2:1-2]. O Verbo que criou o universo não se isola em templos: Ele celebra, participa, dignifica a alegria humana. Ao mencionar \"um casamento em Caná da Galileia\", João sussurra que todo banquete terreno antecipa o dia em que o Esposo ressurgirá e brindará a nova criação. Mas, a alegria do banquete terreno não se compara ao júbilo eterno da vitória do Cordeiro de Deus. Discípulos aprendem cedo: seguir Jesus é também convidá-lo para os momentos mais naturais da existência humana. A presença de Cristo entre nós já é, em si, um milagre singular. Que cada festa, mesa ou rotina se torne palco da visitação divina — pois onde Cristo é bem-vindo, coisas maiores sempre acontecem.\n\nÓ Majestoso e Divino Jesus, centro eterno da verdadeira alegria. Aceita hoje o nosso convite e senta-Te à mesa do cotidiano. Se, no palco da vida, nos faltar paz, derrama Tua plenitude e vem sobre nós com Tua doce e consoladora presença. Transforma riso fugaz em júbilo eterno, água comum em graça transbordante. Que cada gesto simples — o pão repartido, o abraço ofertado, o trabalho diário — seja consagrado pela Tua presença. Livra-nos da festa sem sentido e faz do coração um salão aberto à Tua glória. Então, quando o céu tocar a terra em nossa casa, todos saberão: o Senhor está aqui, e coisas maiores florescerão.\n\nArisvaldo Marinho Cunha\n\nA. M. Cunha\n\n\"Tendo acabado o vinho, a mãe de Jesus lhe disse: Eles não têm mais vinho. Mas Jesus lhe disse: Mulher, que tenho eu contigo? Ainda não é chegada a minha hora. Então, ela falou aos serventes: Fazei tudo o que ele vos disser.","commentary":"Quando a escassez ameaça a festa e o coração se vê à beira do constrangimento, a fidelidade à voz de Cristo abre caminho para milagres inesperados. Foi assim em Caná — uma celebração prestes a se tornar vergonha. Mas onde a esperança parece escassa, o coração que confia no Senhor descansa nAquele que trabalha para os que n'Ele esperam [Isaías 64:4]. Maria, com um coração humilde, contemplativo e cheio de fé, exortou os serventes daquela festa: \"Fazei tudo o que ele vos disser\" [João 2:5]. O milagre não começou com uma transformação visível, mas com escuta obediente e silenciosa. A Graça se manifesta, primeiro, no coração que responde mesmo sem entender. A alma que ouve a Cristo, logo descobrirá que sua fidelidade prepara o terreno para o impossível. A fé que espera, escuta e obedece, logo participará dos sinais que revelam a Glória dAquele que transforma a água em vinho — o ordinário, em altar de revelação.","prayer":"Amado e Fiel Senhor, que transforma silêncio em sinal e escassez em abundância, ensina-nos a esperar quando não vemos, a confiar quando não entendemos, e a obedecer quando tudo em nós pede explicação. Tu conheces os bastidores da festa e o peso secreto da escassez que bate à porta. Quando nossa alma se cala diante do constrangimento, que a Tua presença seja resposta antes do milagre, consolo antes da provisão. Dá-nos um coração pronto para crer, disposto a ouvir, atento ao que Tu dizes."},
{"ref":"João 2:6-8","chapter":2,"quote":"Estavam ali seis potes de pedra, que os judeus usavam para as purificações, e em cada um cabiam cerca de cem litros. Jesus lhes disse: — Encham de água esses potes. E eles os encheram totalmente. Então lhes disse: — Agora tirem um pouco e levem ao responsável pela festa. Eles o fizeram.","commentary":"Quando o Verbo Divino entra em cena, até os vasos cerimoniais da antiga aliança, tocados pela Graça, ganham nova vocação. Ali estavam as talhas de pedra — grandes, pesadas, destinadas às purificações judaicas [João 2:6]. Símbolos silenciosos de um sistema que agora encontrava plenitude no Messias presente. Jesus não as rejeitou, mas as redimiu. Não substituiu o recipiente, transformou o conteúdo. Mesmo sem sinais visíveis, os servos obedeceram: encheram os potes, tiraram do seu conteúdo e o levaram ao responsável pela festa. A água ainda era água — até que, no caminho da fidelidade, o céu decidiu intervir. O antigo se tornou novo; o comum, sagrado; o inesperado aconteceu — e todos desfrutaram do milagre. Cristo inaugurou ali, no palco da vida cotidiana, não apenas um milagre, mas o prenúncio da nova criação. Ele converteu rituais em revelação, recipientes em testemunho, e o ordinário em altar para Sua glória. Onde há fé que obedece, há sempre espaço para que o invisível floresça no visível.","prayer":"Ó Cristo Bendito, que não desprezas os vasos antigos, mas os enches com nova glória, toma também o nosso coração — frágil, cansado, limitado — e faz dele cálice que transborde a alegria do Teu Reino. Ensina-nos a obedecer mesmo sem ver, a encher até a borda mesmo sem compreender, a caminhar com fé mesmo quando nada parece mudar. Que o som da Tua voz sobrepuje o silêncio do invisível. Faze, Senhor, do comum um altar da Tua Glória; do ritual vazio, uma porta para a revelação; da rotina, um cenário para Tua doce manifestação. Que a nossa fidelidade silenciosa se torne solo fértil — onde o ordinário resplandeça com Tua Majestade e o oculto revele a grandeza da Tua Glória."},
{"ref":"João 2:9-10","chapter":2,"quote":"Quando o responsável pela festa provou a água transformada em vinho — ele não sabia de onde tinha vindo, por mais que os serventes que haviam tirado a água soubessem —, chamou o noivo e lhe disse: — Todos costumam servir primeiro o vinho bom e, quando já beberam muito, servem o vinho inferior; você, porém, guardou o melhor vinho até agora!","commentary":"A graça divina, tantas vezes, age em silêncio — e mesmo quem não viu o que Deus fez pode provar do Seu milagre. Em Caná, Jesus realizou Seu primeiro sinal. Os servos viram o processo e ouviram a voz do Mestre. Já o responsável pela festa, sem saber de nada, provou o vinho novo e louvou o resultado [João 2:9--10]. Assim é com muitos: saboreiam bênçãos sem reconhecer a fonte. Mas o Senhor age — e Sua glória chega, mesmo quando não é percebida. Caná nos lembra: Deus não precisa de plateia para cumprir promessas. Contudo, quando se conhece que a fonte é Cristo, a alma transborda reverência e gratidão. É preciso distinguir entre o milagre que se prova e o milagre que se conhece. E quão bem-aventurado é estar entre os que não apenas desfrutam, mas reconhecem e seguem o Autor da graça. A glória de Deus se manifesta tanto no silêncio do processo quanto na doçura do resultado — e reconhecê-la é o mais puro louvor ao Cordeiro Redentor.","prayer":"Ó Fonte Inesgotável de Toda Graça, Cristo Bendito e Majestoso! Tu que operas maravilhas no secreto e fazes jorrar a alegria do Teu Reino onde só havia sequidão, ensina-nos a não buscar apenas o sabor da bênção, mas o som da Tua voz. Que não sejamos apenas convidados da festa, mas servos atentos ao Teu comando, participantes do Teu mover invisível. Livra-nos da cegueira de uma gratidão sem reverência, do louvor sem entendimento, do gozo sem rendição. Faze-nos daqueles que não apenas provam o milagre, mas reconhecem o seu Autor — e repartem, com entrega fiel, a própria vida contigo."},
{"ref":"João 2:11-12","chapter":2,"quote":"Com este, deu Jesus princípio a seus sinais em Caná da Galileia; manifestou a sua glória, e os seus discípulos creram nele. Depois disto, desceu ele para Cafarnaum, com sua mãe, seus irmãos e seus discípulos; e ficaram ali não muitos dias.","commentary":"O primeiro sinal de Cristo aconteceu fora do ambiente sacro — à mesa de uma festa, onde almas se reúnem e a graça se derrama livremente sobre os que têm sede. No coração de uma celebração familiar, o Verbo encarnado revelou Sua glória, transformando escassez em plenitude. Os que estavam próximos discerniram o milagre: o Messias não veio apenas para os feitos grandiosos, mas para redimir o cotidiano, elevar o simples e santificar a vida comum. A festa em Caná nos recorda que Deus age onde o coração O reconhece — mesmo que seja na casa, à mesa ou na rotina. Quando Cristo é bem-vindo e Sua presença é reverenciada, até o trivial se torna sagrado. Do ordinário ao extraordinário, Ele é a ponte que une nossa rotina à eternidade de Seu Reino.","prayer":"Ó Cristo Sublime, Glória do Pai revelada entre nós, Tu que consagras a simplicidade e tornas glorioso o comum, vem, hoje também, visitar os espaços onde vivemos. Ensina-nos a esperar maravilhas mesmo quando a vida parece trivial, a reconhecer Teu toque nos bastidores da existência, e a discernir a Tua mão nos detalhes que o mundo não nota. Faze-nos ver que Tua glória não se limita aos grandes momentos, mas repousa suave sobre panelas, promessas e pequenos passos de fé. Santifica, Senhor, pelo poder da Tua Palavra, os nossos dias comuns — transformando-os em eternos testemunhos do Reino que já está entre nós."},
{"ref":"João 2:13-16","chapter":2,"quote":"Estando próxima a Páscoa dos judeus, Jesus foi para Jerusalém. E encontrou no templo os que vendiam bois, ovelhas e pombas e também os cambistas assentados. Tendo feito um chicote de cordas, expulsou todos do templo, com as ovelhas e os bois. Derramou o dinheiro dos cambistas pelo chão, virou as mesas e disse aos que vendiam as pombas: — Tirem estas coisas daqui! Não façam da casa de meu Pai uma casa de negócio!","commentary":"Quando a adoração se torna mercadoria, o Templo transforma-se em mercado — e o coração, uma vitrine vazia. Com zelo santo e autoridade profética, Jesus derrubou as mesas dos que trocavam fé por lucro e declarou: \"Não façam da casa de meu Pai uma casa de negócio!\" [João 2:16]. Na Páscoa, o coração humano precisava ser purificado; e ainda hoje, somos chamados a rejeitar toda ambição que corrompe o santuário da alma. Cristo não apenas purifica o lugar da oração — Ele redime o culto, devolvendo-lhe sua essência: amor rendido, e não barganha disfarçada de devoção. A purificação do Templo, realizada por Jesus, foi um sinal visível de uma obra mais profunda, urgente e necessária: o início de uma restauração interior, onde a verdadeira adoração volta a ocupar seu lugar entre os que O recebem.","prayer":"Quão Maravilhoso és, ó Cordeiro Santo! Tu és o Supremo Guardião da espiritualidade humana, o Autor e consumador da Fé. Vem hoje purificar o santuário do nosso coração. Expulsa de nós toda ambição disfarçada de devoção, toda vaidade mascarada de serviço, todo orgulho travestido de santidade. Redime em nós o altar da adoração verdadeira — onde não se vende, mas se rende; onde não se busca troca, mas entrega. Santifica-nos, Senhor, com Teu zelo santo. Faze de nós templos vivos, consagrados à Tua glória — onde o Pai seja honrado, o Filho exaltado, e o Espírito entronizado."},
{"ref":"João 2:17-22","chapter":2,"quote":"Os seus discípulos se lembraram que está escrito: \"O zelo da tua casa me consumirá.\" Então os judeus lhe perguntaram: — Que sinal você nos mostra para fazer essas coisas? Jesus lhes respondeu: — Destruam este santuário, e em três dias eu o levantarei. Os judeus responderam: — Este santuário foi edificado em quarenta e seis anos, e você quer levantá-lo em três dias? Ele, porém, se referia ao santuário do seu corpo. Quando, pois, Jesus ressuscitou dentre os mortos, os discípulos dele se lembraram que ele tinha dito isso e creram na Escritura e na palavra de Jesus.","commentary":"Quando o zelo por Deus consome o coração, até as palavras do passado se acendem em nova fé. Ao verem Jesus purificar o Templo, os discípulos se lembraram: \"O zelo pela Tua casa me consumirá\" [João 2:17; Salmos 69:9]. Os líderes religiosos, porém, pediram um sinal que justificasse tal autoridade. E Jesus lhes apontou o maior de todos: Sua ressurreição. Ele, o verdadeiro Templo da Presença divina, declarou: \"Destruam este templo, e eu o levantarei em três dias\" [João 2:19]. Não falava de pedras nem de colunas, mas de Si mesmo — Aquele cujo corpo é o novo Santuário de Deus entre os homens. Na cruz, foi sacrificado; na ressurreição, exaltado. Só depois da Páscoa os discípulos entenderam plenamente o que Ele dissera. Suas memórias, tocadas pelo Espírito, tornaram-se instrumentos de fé: Creram na Escritura e na palavra que Jesus dissera [João 2:22]. A presença do Cristo Vivo transforma até nossas lembranças em lugares de revelação. Nele, até o passado se torna altar de fé.","prayer":"Ó Cristo Ressurreto, Templo vivo da glória eterna! Tu que fizeste da cruz um altar e da Tua ressurreição o selo da Tua Majestade, vem e visita o santuário do nosso ser. Faz arder em nós o mesmo zelo que consumiu Teu coração, e purifica nossa memória com o fogo suave do Teu Espírito. Santifica nossas lembranças — as que doem, as que jaziam esquecidas, as que ainda não compreendemos — e transforma cada uma em altar de fé renovada. Livra-nos de um culto sem coração, de um zelo sem verdade, de uma devoção sem cruz. Tu és o Santuário Eterno — em Ti, até o passado floresce em revelação."},
{"ref":"João 2:23-25","chapter":2,"quote":"Estando ele em Jerusalém, durante a Festa da Páscoa, muitos, vendo os sinais que ele fazia, creram no seu nome; mas o próprio Jesus não se confiava a eles, porque os conhecia a todos. E não precisava de que alguém lhe desse testemunho a respeito do homem, porque ele mesmo sabia o que era a natureza humana.","commentary":"A fé que começa nos sinais precisa crescer até o coração do Salvador — pois provar das bênçãos não é o mesmo que pertencer a Cristo, e crer sem se entregar é renunciar ao caminho natural da fé. Na Festa da Páscoa, muitos creram em Jesus por causa dos sinais que viram [João 2:23]. Mas Ele, conhecendo os corações, não se confiava a eles [João 2:24-25]. O Verbo encarnado não se impressiona com entusiasmo superficial, pois enxerga a essência e discerne as intenções. Há uma fé que admira milagres, mas não se rende ao Senhor. Uma fé que aplaude, mas não se prostra. Por isso, o Cristo não busca apenas crentes — Ele chama discípulos. Fé verdadeira é mais que reconhecimento: é entrega. Onde Cristo vê convicção, Ele planta aliança. Onde só há fascínio, Ele se cala. O chamado do Evangelho é para uma fé que cresce, aprofunda e se consagra. Cristo não se confia a quem apenas o admira; Ele se revela àqueles que o seguem.","prayer":"Ó Cristo Onisciente e Maravilhoso, que sondas o mais íntimo do ser e não te deixas iludir por gestos vazios, a Ti elevamos nosso clamor neste dia. Não permitas que fiquemos à porta dos Teus milagres sem jamais entrarmos na no recinto da comunhão do Teu coração. Livra-nos da fé que observa, mas não obedece; que admira, mas não se rende; que reconhece, mas não se entrega. Que nossa fé não dependa de sinais, mas se firme na Tua Palavra. E que, ao fim de cada dia, sejamos achados entre os que não apenas creram, mas viveram para Te seguir, amar e glorificar."},
{"ref":"João 3:1-2","chapter":3,"quote":"Havia, entre os fariseus, um homem chamado Nicodemos, um dos principais dos judeus. Este, de noite, foi ter com Jesus e lhe disse: Rabi, sabemos que és Mestre vindo da parte de Deus; porque ninguém pode fazer estes sinais que tu fazes, se Deus não estiver com ele.","commentary":"O Mestre da Vida não se deixa influenciar por palavras lisonjeiras a Seu respeito. Não será suficiente reconhecer que Jesus veio da parte de Deus. O que se requer é que os homens se unam a Cristo para que participem efetivamente da vida divina. Nicodemos — fariseu, mestre em Israel, homem de prestígio e rigor religioso — porém, sua alma carecia de luz. Ele foi à noite ter com Jesus e confessou: \"Rabi, sabemos que és Mestre vindo da parte de Deus [\\...]\" [João 3:2]. Sua confissão revelou um reconhecimento respeitoso, mas incompleto: Era uma fé nascida dos sinais, mas ainda não transformada em fé salvadora. Nicodemos representa muitos: próximos da verdade, mas ainda fora dela; tocados pelos sinais, mas não regenerados pela fé viva. Jesus não se impressiona com honras humanas. Ele chama à contrição de coração, à entrega plena, ao nascimento do alto. Ainda hoje o Mestre Divino convida a reconhecê-Lo e recebê-Lo — como Salvador e Senhor, origem de uma vida totalmente nova.","prayer":"Soberano e Sublime Jesus, Luz Eterna para os que Te buscam, dissipa, com a Tua presença gloriosa, qualquer sinal de ignorância em nossa alma. Que não apenas conheçamos a Verdade, mas sejamos libertos por ela; não apenas vejamos sinais, mas eles sejam pontes que nos conduzem aos Teus braços. Livra-nos da fé que apenas admira, mas não se entrega; do saber que argumenta, mas não se curva; da piedade dissimulada, que não se rende. Faz-nos mais que estudiosos da fé: faz-nos filhos regenerados, adoradores em espírito e verdade, cujos corações são transformados pelo poder do alto."},
{"ref":"João 3:3-4","chapter":3,"quote":"A isto, respondeu Jesus: Em verdade, em verdade te digo que, se alguém não nascer de novo, não pode ver o reino de Deus. Perguntou-lhe Nicodemos: Como pode um homem nascer, sendo velho? Pode, porventura, voltar ao ventre materno e nascer segunda vez?","commentary":"Apenas os que nascem do alto podem discernir o Reino que desce do céu — pois não é com olhos da carne que se vê o que só o Espírito pode revelar. Diante de um fariseu respeitado e religioso, Jesus não responde ao reconhecimento com aprovação, mas com revelação. \"Em verdade, em verdade te digo: ninguém pode ver o Reino de Deus, se não nascer de novo\" [João 3:3]. A cegueira de Nicodemos não era intelectual, mas espiritual. Sua pergunta: \"Como pode um homem nascer, sendo velho?\" [João 3:4], revela mais do que confusão: revela a limitação de uma fé sem rendição. Não basta conhecer doutrina. É necessário nascer do Espírito. O Reino não se enxerga com os olhos da carne, nem se conquista com as mãos da moral. Ele é visto por aqueles que foram regenerados pelo sopro do alto. O novo nascimento é a resposta de Deus à insuficiência humana. É o milagre da graça, que transforma estudiosos em discípulos, e admiradores em filhos.","prayer":"Ó Espírito Eterno, Sopro da Vida Nova, Tu que iluminas os olhos cegos e faz renascer os corações cansados, vem, mais uma vez, visitar o santuário do nosso interior com Teu poder regenerador. Não permitas que nos alimentemos de elogios vazios, de crenças incompletas, de moralidade sem nova natureza. Que a brisa suave do novo nascimento conduza nossos passos para o centro da Tua vontade. Livra-nos da fé que admira, mas não se entrega; da devoção que observa, mas não se rende. Ensina-nos a depender do alto, a esperar por Ti, a viver como filhos regenerados — não apenas observadores à distância, mas participantes do Teu Poderoso Reino, cheio de Graça e Verdade."},
{"ref":"João 3:5-7","chapter":3,"quote":"Respondeu Jesus: Em verdade, em verdade te digo: quem não nascer da água e do Espírito não pode entrar no reino de Deus. O que é nascido da carne é carne; e o que é nascido do Espírito é espírito. Não te admires de eu te dizer: importa-vos nascer de novo.","commentary":"Nada menos que uma nova vida é o que se requer para que se tenha um correto relacionamento com Deus. O novo nascimento é, portanto, inegociável. Jesus olha para Nicodemos — mestre das Escrituras e autoridade religiosa — e declara: \"Em verdade, em verdade te digo: ninguém pode entrar no Reino de Deus se não nascer da água e do Espírito\" [João 3:5]. Não se trata de reforma moral, mas de nova criação. O Reino não se acessa com reputação, mas com regeneração. Nascer da água e do Espírito não são dois passos, mas uma única obra — um só milagre. Um eco da promessa de Deus em Ezequiel 36:25-27: purificação pela água, vivificação pelo Espírito. Jesus insiste: \"Não te admires de eu te dizer: importa-vos nascer de novo\" [João 3:7]. É um chamado à rendição. A salvação não é o aperfeiçoamento do velho homem, mas o surgimento do novo — fruto exclusivo da ação soberana de Deus. A entrada no Reino não se conquista por mérito, nem se barganha com conhecimento: ela se recebe como dom, quando o Espírito sopra, e faz nascer em nós o que jamais conseguiríamos gerar por nós mesmos.","prayer":"Ó Soberano Deus da nova criação, Sopro Eterno que vivifica os desertos do coração humano, vem mais uma vez com Teu poder invisível e invencível. Alcança os sedentos com a água da Tua Graça, purifica-nos com o fogo do Teu Espírito. Desperta em nós um coração que não confia em títulos, méritos ou saber, pois o Teu Reino não favorece o esforço humano, mas acolhe os que estão rendidos ao milagre da regeneração. Sopra, ó Santo Espírito, sobre os vales da incredulidade, e faz nascer o que jamais poderia brotar pela força do braço da carne. Louvado seja o Teu Nome, ó Maravilhoso Senhor, porque Tu és o Deus que gera a vida do alto — e sem o Novo Nascimento, ninguém pode entrar no Teu Reino."},
{"ref":"João 3:8-10","chapter":3,"quote":"O vento sopra onde quer, ouves a sua voz, mas não sabes donde vem, nem para onde vai; assim é todo o que é nascido do Espírito. Então, lhe perguntou Nicodemos: Como pode suceder isto? Acudiu Jesus: Tu és mestre em Israel e não compreendes estas coisas?","commentary":"Há realidades do Espírito que nem mesmo o conhecimento humano mais refinado é capaz de alcançar. O vento sopra onde quer — e assim é todo aquele que nasceu do Espírito. Jesus não entrega fórmulas a Nicodemos, mas apresenta uma imagem viva: o vento. Ele sopra, ouve-se o seu som, mas não se sabe de onde vem, nem para onde vai. Assim também é o novo nascimento: não se controla, não se prevê, não se produz humanamente — apenas se recebe. É dom, é mistério, é milagre [João 3:8]. A perplexidade de Nicodemos — \"Como pode ser isso?\" [João 3:9] — revela os limites de uma mente iluminada pelo saber, mas ainda não tocada pela graça de Deus. \"Tu és mestre em Israel e não compreendes estas coisas?\" [João 3:10]. A pergunta de Jesus é uma repreensão compassiva, que expõe o perigo de um intelecto cheio de letras, mas um coração ainda vazio do Espírito. O Reino de Deus não se vê com os olhos da razão apenas, mas com os olhos de uma fé regenerada. O Espírito sopra onde quer, quando quer e como quer — e onde Ele sopra, a vida floresce onde antes havia apenas morte.","prayer":"Ó Espírito Santo de Deus, Tu que sopras onde queres, com liberdade e poder, vem e desperta os corações adormecidos com o sopro da vida eterna. Faz calar o orgulho do saber humano, e acende em nós a humildade da fé que acolhe, que se curva, que escuta — e se rende. Sopra onde há desespero. Sopra onde há morte. Sopra onde há incredulidade — e faz brotar vida onde nada florescia. Tu és invisível, mas irresistível. Inesperado, mas infalível. Faz de nós não apenas ouvintes da Tua voz, mas testemunhas vivas do Teu mover — rendidas ao Teu sopro, moldadas para o Teu Reino."},
{"ref":"João 3:11-13","chapter":3,"quote":"Em verdade, em verdade lhe digo que nós falamos do que sabemos e damos testemunho do que vimos, mas vocês não aceitam o nosso testemunho. Se vocês não creem quando falo sobre coisas terrenas, como crerão se eu lhes falar sobre as celestiais? Ora, ninguém subiu ao céu, a não ser aquele que de lá desceu, o Filho do Homem.","commentary":"Assim como nem todo saber vem da terra — nem toda fé escuta o céu. Nicodemos, mestre em Israel, tropeçou no mistério do novo nascimento — incapaz de compreender que a vida espiritual não brota da erudição humana, mas de uma intervenção divina. Jesus não fala como um teórico, mas com a autoridade de quem veio do céu, trazendo consigo a própria realidade de Deus. Sua palavra não é mera instrução, mas a voz viva do Céu. Ele não apenas apresenta a verdade — Ele é a personificação dessa verdade. Ele é ponte entre o divino e o humano, entre o celestial e o terreno. Somente Aquele que habita eternamente na glória do Pai pode nos revelar os caminhos da vida e o majestoso sentido da eternidade.","prayer":"Ó Cristo eterno, Voz viva do Céu, Tu que desceste em glória para nos revelar o invisível, planta em nós uma fé que ouve — e obedece. Livra-nos de uma devoção teórica, e faze-nos viver inflamados pelo fogo do novo nascimento. Que Tua palavra nos encontre rendidos, não apenas informados — mas transformados. Tu és a ponte entre o céu e a terra, a Verdade que caminha conosco. Revela-nos os caminhos da vida e o majestoso sentido da eternidade."},
{"ref":"João 3:14-15","chapter":3,"quote":"E do modo por que Moisés levantou a serpente no deserto, assim importa que o Filho do Homem seja levantado, para que todo o que nele crê tenha a vida eterna.","commentary":"Ao se referir ao modo como Moisés levantou a serpente no deserto, o Cristo das Escrituras interpretou as Escrituras do Cristo, afirmando que o Filho do Homem também seria levantado. Se a serpente do Éden apontava para a tragédia da queda, a serpente do deserto indicava como Deus haveria de aniquilar o mal. No deserto, Moisés levantou a serpente — e o povo foi curado. No Calvário, embora os romanos tenham erguido Cristo na cruz, era a mão do próprio Pai Celeste que levantava o Seu Amado Filho. Dos inigualáveis lábios do Salvador ouvimos a razão de sua crucificação: \"para que todo o que nele crê tenha a vida eterna\" João 3:14-15. Ali, no Calvário, Cristo é tudo: — o Cordeiro que se oferece; — o Sacerdote que intercede; — o Deus que, recebendo a oferta, redime o pecador. Cristo é o altar onde a justiça se encontra com a misericórdia, e a eternidade toca a história dos homens. Na cruz, o mal não vence. Ele é vencido. O veneno da serpente é tragado pela graça de Deus. A morte é reescrita pela vida.","prayer":"Ó Cristo exaltado, Soberano nos céus e na terra, Tu és o Cordeiro que se entregou, o Sacerdote que intercede, o Deus que redime. Na cruz, fizeste da vergonha um trono, da dor uma ponte, do juízo um altar de misericórdia. Todos nós fomos marcados pelo veneno da queda, mas o Teu sangue — puro, santo, redentor — tragou a morte com o poder da vida. Fixa, Senhor, nossos olhos em Ti — não no caos, nem nas serpentes que rastejam no vale da alma. Dá-nos olhos de fé para ver o Teu amor suspenso entre o céu e a terra, fazendo da cruz o lugar onde o tempo toca a eternidade e a redenção concede vida ao pecador arrependido. Ó Cristo erguido entre os céus e a terra, salva-nos, sustenta-nos, santifica-nos."},
{"ref":"João 3:16","chapter":3,"quote":"Porque Deus amou ao mundo de tal maneira que deu o seu Filho unigênito, para que todo o que nele crê não pereça, mas tenha a vida eterna.","commentary":"Há um amor que nos precede, nos persegue e nos preserva. É o amor de Deus. Antes que houvesse fé em nós, houve entrega Nele. Antes que disséssemos \"sim\", Ele já tinha dado Seu Filho. João 3:16 não é apenas um versículo. É o coração pulsante do Evangelho. É a dádiva de Deus a um mundo em trevas, a promessa de vida à alma cansada, a certeza de que a cruz não foi um acidente, mas um ato eterno de amor incondicional de Deus por nós — manifestado em Seu Filho. Porque Deus amou. Porque Deus deu o Seu Filho Unigênito, para que todo o que Nele crê viva — e viva para sempre. A fé que crê nesse amor não apenas faz a alma sobreviver — ela floresce em vida eterna. A alma que crê não perece. Ela renasce. O amor que entregou o Filho é o mesmo que hoje nos segura pela mão.","prayer":"Ó Deus eterno, fonte de todo amor, Tu que não poupaste Teu próprio Filho, mas O entregaste por nós, pecadores, recebe a nossa gratidão e o nosso louvor. Quando andávamos em trevas, Teu amor nos precedeu. Quando fugíamos em incredulidade, Teu amor nos perseguiu. E agora que cremos, Teu amor fiel nos preserva. Senhor, firma nossos pés nesse amor, não em méritos, não em obras, mas na dádiva inigualável da cruz. Que jamais esqueçamos: a cruz não foi acidente, mas escolha — não do homem, mas do Cordeiro. E se o amor que entregou o Filho nos segura pela mão, leva-nos, ó Deus, a vivermos como filhos da luz, até o dia em que veremos, face a face, Aquele que por nós foi dado."},
{"ref":"João 3:17-18","chapter":3,"quote":"Porquanto Deus enviou o seu Filho ao mundo, não para que julgasse o mundo, mas para que o mundo fosse salvo por ele. Quem nele crê não é julgado; o que não crê já está julgado, porquanto não crê no nome do unigênito Filho de Deus.","commentary":"Em tempos em que o medo do julgamento pesa sobre o coração humano, a luz de João 3:17--18 brilha com esperança: Cristo não veio para condenar, mas para salvar o pecador arrependido, com base na fé em Cristo. A cruz não foi erguida para reforçar a culpa, mas para suportar, em Cristo, a condenação proveniente do pecado — oferecendo Graça antes da sentença. Quem crê no Filho já não caminha sob condenação. Vive, desde agora, sob o favor do Deus que justifica. Contudo, quem rejeita essa fé permanece onde já estava: julgado pela incredulidade, afastado da vida divina, recusando o único nome que salva. Jesus não veio como carrasco, mas como Cordeiro. Não veio para ceifar vidas, mas para resgatar corações arrependidos. Não veio para fechar o céu, mas para abrir o caminho. A salvação está oferecida. A resposta da fé é urgente, necessária e indispensável. No Filho, a misericórdia antecede o juízo. E a fé é o portal da Vida Eterna.","prayer":"Ó Preciso Cordeiro de Deus, que abriste o céu com Teu sangue, vieste a este mundo com propósito redentor: carregar sobre Ti os nossos pecados. Livra-nos da frieza que adia a fé e da incredulidade que nos afasta da Vida Eterna. Ensina-nos a responder com fé viva, arrependimento sincero e obediência confiante. Que hoje trilhemos o caminho que Tua graça abriu — com temor santo e esperança firme. Em Teu nome, único e suficiente, suplicamos: salva os pecadores contritos e sustentando-os até o fim."},
{"ref":"João 3:19-20","chapter":3,"quote":"O julgamento é este: que a luz veio ao mundo, e os homens amaram mais as trevas do que a luz; porque as suas obras eram más. Pois todo aquele que pratica o mal aborrece a luz e não se chega para a luz, a fim de não serem arguidas as suas obras.","commentary":"A luz de Deus não apenas ilumina, revela e transforma. Ela julga, exorta e confronta. E é por isso que muitos a rejeitam. Jesus, a Verdadeira Luz do mundo, foi rejeitado, porém, não por ser incompreendido, mas por ser claro demais em Sua mensagem. A luz que Ele trouxe não apenas mostrou o caminho, mas expôs os atalhos escuros e enganosos do coração. Há, no íntimo do ser humano, uma inclinação antiga: amar mais as trevas do que a luz. É um desejo profundo de permanecer escondido — e afastado da Verdade que liberta. Mas a luz de Cristo não veio para humilhar — veio para curar. Ela não expõe para condenar, mas para regenerar. Quem resiste à luz, permanece em trevas. Mas quem se achega a ela com fé, descobre que até as suas sombras podem se tornar testemunho da Graça de Deus. A luz que julga, exorta e confronta é a mesma que salva. E hoje, ela ainda brilha para salvar — iluminando, revelando e transformando.","prayer":"Ó Cristo, Luz verdadeira que vieste ao mundo, rendemos-Te glória pelo Teu brilho que nos confronta e pela Tua compaixão que nos cura. Tua luz santa expõe e transforma. Tu sondas as trevas mais densas da alma. Perdoa-nos por amarmos mais a sombra que o brilho, por fugirmos da luz que liberta, por escolhermos atalhos obscuros em vez do caminho que leva à vida. Dá-nos coragem, Senhor, de trazer à luz tudo o que escondemos. Dá-nos fé para crer que Tu não revelas para nos humilhar, mas para nos conduzir pelos caminhos da regeneração. Toca-nos com a Tua luz — e faze de nós tochas de graça no meio da escuridão do mundo."},
{"ref":"João 3:21","chapter":3,"quote":"Quem pratica a verdade aproxima-se da luz, a fim de que as suas obras sejam manifestas, porque feitas em Deus.","commentary":"Há quem fuja da luz por temer ser exposto por ela. Mas há também quem se aproxima dela — não para mostrar o que faz, mas para revelar o que Deus tem feito em sua vida. Jesus disse que quem \"pratica a verdade\" vem para a luz, e que suas obras são \"feitas em Deus\" [João 3:21]. A fé autêntica não tem medo de ser examinada. Ela não se esconde — ela resplandece. Não para exibir justiça própria, mas para mostrar que há um Deus vivo operando no mais íntimo do ser. O crente que vive na luz não vive para provar sua santidade, mas para testemunhar a Graça que o transformou. A luz que expõe também revela que há vida sendo gerada por Deus, no oculto, no secreto, no profundo. E essa vida — por ser de Deus — se manifesta. Que a fé que temos não nos esconda, mas nos conduza cada vez mais para a luz que salva, cura e transforma.","prayer":"Ó Cristo Eterno e Glorioso, Luz que nunca se apaga, concede-nos um coração que se curva diante de Ti — não com obras para serem exibidas, mas com a alma aberta para Teu agir. Nada em nós merece aplauso, mas confiamos em Tua Majestosa Graça — que tudo transforma. Ensina-nos a amar a verdade mais que a reputação, a buscar a luz mais do que as aparências, a viver diante de Ti, mais do que diante dos homens. Concede-nos, ó Santo Deus, a consciência de que, se há em nós alguma prática da verdade, tudo vem de Ti — e deve ser vivido para a Tua Glória e Honra."},
{"ref":"João 3:22-24","chapter":3,"quote":"Depois disto, foi Jesus com seus discípulos para a terra da Judéia; ali permaneceu com eles e batizava. Ora, João estava também batizando em Enom, perto de Salim, porque havia ali muitas águas, e para lá concorria o povo e era batizado. Pois João ainda não tinha sido encarcerado.","commentary":"O discipulado cristocêntrico não se constrói na pressa — mas na permanência. Quando Deus quer formar um discípulo com coração rendido e moldar esse coração à imagem do Seu Filho, Ele não age com pressa — Ele manifesta Sua presença. Por isso o evangelista João registra que Jesus \"permaneceu com eles\" [João 3:22]. Antes dos sinais, veio a convivência. Antes do ministério público, houve relacionamento íntimo. Cristo não chamou discípulos para a pressa, mas para a profundidade. Sua formação se dá com o tempo, proximidade e Palavra Viva — compartilhada entre passos, silêncios e orações. Mesmo enquanto João Batista ainda batizava, o evangelista faz questão de nos lembrar: João Batista ainda não tinha sido encarcerado [João 3:24]. A história não está solta ao acaso — está sendo tecida por mãos providenciais. A transição entre o precursor, João Batista, e o Messias não é acidental — é intencional. Num mundo apressado por resultados, o Evangelho nos lembra: toda transformação verdadeira começa com Cristo — e se aprofunda em comunhão com Ele. Quem permanece com Ele não apenas caminha — floresce, manifestando Sua Glória. O Cristo que permanece é o Cristo que transforma. E onde Ele habita, até o tempo se torna sagrado.","prayer":"Ó Cristo que permanece, aos Teus pés é que os verdadeiros discípulos são formados. Não há pressa nesse processo — ensina-nos a desacelerar diante da Tua glória. Livra-nos da pressa que esvazia, do ativismo que rouba a adoração, da urgência que ignora o altar. Atrai-nos de volta ao aconchego da Tua presença. Não queremos correr à frente de Ti, nem caminhar longe de Ti. Queremos permanecer ao Teu lado. Onde a alma floresce. Onde a Tua presença molda. Onde tudo é sagrado — porque Tu estás ali."},
