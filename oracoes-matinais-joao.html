{"ref":"João 19:40-42","chapter":19,"quote":"Tomaram, pois, o corpo de Jesus e o envolveram em lençóis com os aromas, como é de uso entre os judeus na preparação para o sepulcro. No lugar onde Jesus fora crucificado, havia um jardim, e neste, um sepulcro novo, no qual ninguém tinha sido ainda posto. Ali, pois, por causa da preparação dos judeus e por estar perto o túmulo, depositaram o corpo de Jesus.","commentary":"O mistério da providência divina se revela de forma silenciosa nos cenários mais improváveis, pois aquilo que parece mera conveniência humana é, na verdade, o cumprimento preciso do desígnio eterno de Deus. O corpo do Cordeiro Imaculado é envolto em lençóis e aromas, conforme o costume dos judeus, e colocado em um túmulo novo, em um jardim próximo ao lugar da crucificação [João 19:40-42]. O que aos olhos humanos se apresenta como urgência e oportunidade, diante da proximidade do sábado, revela-se como soberania que governa cada detalhe. O Gólgota, símbolo da morte e da vergonha, é ladeado por um jardim, sinal de vida e esperança. O Verbo Eterno, que no princípio plantou a vida, agora repousa no silêncio da terra, não como derrotado, mas como aquele que prepara a vitória definitiva. O coração que contempla essa cena é conduzido além das aparências, aprendendo que Deus opera mesmo quando tudo parece encerrado. O sepulcro não é o fim, mas o limiar. O silêncio não é ausência, mas gestação. Cristo repousa. Cristo governa. Cristo vive.","prayer":"Ó Senhor da vida e da morte, que foste envolto em silêncio no jardim e ainda assim permaneceste soberano sobre todas as coisas, molda o nosso coração para que confiemos nos Teus desígnios. Que, nos momentos de silêncio e espera, aprendamos a discernir o Teu agir invisível e soberano. Conduze-nos a uma vida amadurecida, que repousa em Ti, certa de que, ao Teu lado, o nosso coração aprenderá a descansar na Tua promessa."},
{"ref":"João 20:1-2","chapter":20,"quote":"No primeiro dia da semana, Maria Madalena foi ao sepulcro de madrugada, sendo ainda escuro, e viu que a pedra estava revolvida. Então, correu e foi ter com Simão Pedro e com o outro discípulo, a quem Jesus amava, e disse-lhes: Tiraram do sepulcro o Senhor, e não sabemos onde o puseram.","commentary":"O paradoxo do coração humano é este: pode amar sinceramente a Cristo e, ainda assim, enxergar apenas parte da glória que está diante dos olhos. Maria Madalena vai ao sepulcro \"sendo ainda escuro\" [João 20:1], e essa escuridão não é somente a da manhã, mas também a do entendimento ainda ferido pela dor. Seu amor é verdadeiro, seus passos são apressados, sua busca é honesta; contudo, sua leitura dos fatos ainda é menor que a realidade de Deus. Ela vê a pedra revolvida, mas ainda não discerne que o Cordeiro Imaculado venceu a morte. Ela corre, anuncia, chora em expectativa quebrada: \"Tiraram do sepulcro o Senhor\" [João 20:2]. Assim é a alma humana diante dos atos do Altíssimo: percebe os sinais, mas nem sempre alcança de imediato a plenitude do milagre. E, no entanto, o Cristo Glorioso já está operando quando os olhos ainda não conseguem compreendê-Lo. O primeiro dia da semana amanhece com a marca da nova criação. O túmulo aberto não anuncia ausência definitiva, mas o início de uma esperança invencível. Onde o homem supõe perda, Deus já inaugurou triunfo. Onde a alma imagina silêncio, o céu já proclamou vitória. Cristo vive. Cristo reina. Cristo ressurreto dissipa toda treva.","prayer":"Ó Cristo Glorioso, Senhor da vida e vencedor do sepulcro! Tu és a Luz Verdadeira que resplandece quando ainda há sombras sobre a terra e inquietação no coração. Tu operas Teus grandes feitos mesmo quando nossa compreensão é limitada e nossos olhos estão marejados pela dor. Ensina-nos a confiar em Tua obra perfeita, silenciosa e soberana. Que o nosso coração, ainda que trêmulo, repouse na certeza de que Tu já transformaste o vale em jardim e o túmulo em testemunho de glória."},
{"ref":"João 20:3-5","chapter":20,"quote":"Saiu, pois, Pedro e o outro discípulo e foram ao sepulcro. Ambos corriam juntos, mas o outro discípulo correu mais depressa do que Pedro e chegou primeiro ao sepulcro; e, abaixando-se, viu os lençóis de linho; todavia, não entrou.","commentary":"Há urgências da alma que aceleram os passos, mas não vencem, por si sós, o santo tremor diante dos mistérios de Deus. Pedro e o outro discípulo \"foram ao sepulcro\" [João 20:3], movidos não por curiosidade, mas pelo impacto de uma notícia que abalava o coração e a esperança. Ambos corriam juntos; ambos desejavam ver; ambos foram atraídos ao lugar onde o corpo do Senhor estivera. No entanto, o discípulo amado, ainda que tenha chegado primeiro, apenas se abaixa, contempla os lençóis de linho e não entra. O corpo do Cristo Glorioso não está ali, mas os sinais da morte vencida permanecem diante dos olhos. A pressa pode nos levar até a borda do milagre, mas somente a graça divina conduz o coração para dentro do ambiente onde a glória se manifestou. Quantas vezes a alma vê os vestígios da obra do Altíssimo e, ainda assim, hesita diante daquilo que a ressurreição começou a revelar. O túmulo já não guarda o Salvador do Mundo. A ausência do corpo não é derrota, mas anúncio. Os lençóis não proclamam roubo, mas triunfo. O sepulcro não encerra Cristo. O sepulcro testemunha Cristo. O sepulcro se curva ao Cristo vivo.","prayer":"Ó Soberano Jesus, Tu és o Salvador do Mundo, o Redentor Eterno daqueles que creem em Ti. Concede-nos reverência, fé e santo discernimento para que o nosso coração não vacile. Faz-nos avançar, pela Tua Graça, da mera observação para a adoração sincera, viva e transformadora. Que a nossa alma se incline maravilhada diante de Ti e que todo o nosso ser descanse na Tua vitória sobre o pecado e a morte. Reina sobre nós, ó Cristo vivo, com poder, soberania e eternidade."},
{"ref":"João 20:6-7","chapter":20,"quote":"Então, Simão Pedro, seguindo-o, chegou e entrou no sepulcro. Ele também viu os lençóis, e o lenço que estivera sobre a cabeça de Jesus, e que não estava com os lençóis, mas deixado num lugar à parte.","commentary":"A glória de Deus não se manifesta em desordem, mas em sinais serenos de soberania, poder e perfeita intenção. Pedro chega depois, mas entra no sepulcro e contempla mais amplamente aquilo que os olhos apressados do primeiro discípulo ainda não haviam alcançado. Ele viu \"os lençóis\" e viu também \"o lenço que estivera sobre a cabeça de Jesus\" [João 20:6-7], separado, deixado à parte, em lugar próprio. Nada aqui sugere tumulto, violência ou confusão. O Cristo Glorioso não foi arrancado das mãos da morte como quem escapa em desespero. O Salvador do Mundo levantou-se em majestade, com autoridade plena sobre o túmulo, sobre o tempo e sobre a própria morte. Até os panos funerários, agora esvaziados de sua função, tornam-se silenciosas testemunhas da vitória do Ressurreto. Assim também o coração aprende: quando o Soberano Rei age, até os detalhes anunciam Sua glória. O túmulo vazio não fala apenas de ausência, mas de domínio. O lenço deixado à parte não é um detalhe sem voz, mas um sussurro da ordem divina em meio ao espanto humano. O Cristo Ressurreto não deixa rastros de derrota. O Cristo Soberano deixa marcas de glória. O Cristo Majestoso reina com santa glória.","prayer":"Ó Cristo Glorioso, Senhor ressurreto, cuja vitória se revela até nos sinais mais silenciosos do sepulcro! Tu és o Soberano Rei, pleno em poder, perfeito em Tua obra e incomparável em Tua majestade. Nada em Ti é confusão, nada em Ti é derrota, nada em Ti é acaso. Concede-nos olhos reverentes para discernir a Tua glória até nos detalhes, e um coração quieto para descansar na santa ordem da Tua vontade."},
{"ref":"João 20:8-10","chapter":20,"quote":"Então, entrou também o outro discípulo, que chegara primeiro ao sepulcro, e viu, e creu. Pois ainda não tinham compreendido a Escritura, que era necessário ressuscitar ele dentre os mortos. E voltaram os discípulos outra vez para casa.","commentary":"A fé verdadeira pode nascer antes da compreensão plena, porque a Graça de Deus frequentemente acende no coração aquilo que a mente ainda aprenderá a discernir com maior clareza. O outro discípulo entra no sepulcro e, diante dos sinais deixados pelo Cristo Glorioso, \"viu, e creu\" [João 20:8]. Seu olhar já não repousa apenas sobre a ausência do corpo, mas sobre o testemunho silencioso da vitória do Cristo que venceu a morte. Contudo, o texto nos conduz a uma santa humildade: \"ainda não tinham compreendido a Escritura\" [João 20:9]. Eles creram, mas ainda não haviam penetrado toda a largura, profundidade e necessidade divina da ressurreição do Messias Prometido. Assim age o Senhor com os Seus. Ele nos faz avançar da visão para a fé, e da fé para a compreensão mais amadurecida da Palavra Viva. Há fragilidade nos discípulos, mas há também misericórdia soberana abrindo caminho para o coração crer antes mesmo de saber explicar tudo. E, depois disso, \"voltaram os discípulos outra vez para casa\" [João 20:10]. A casa já não é apenas lugar de retorno, mas espaço onde a alma leva consigo o impacto do túmulo vazio. A fé começou. A Escritura falará mais alto. O Ressurreto confirmará tudo.","prayer":"Quão maravilhoso é andar sob a Tua direção, ó Cristo Glorioso, Autor da fé e Senhor da ressurreição! Concede-nos a Graça de ver e crer, ainda que nossa compreensão não esteja completa. Faz-nos amar a Tua Palavra Viva e esperar com reverência o tempo em que Tu mesmo ampliarás em nós o entendimento das Escrituras. Quando a alma estiver frágil, sustenta-nos com Tua misericórdia. Quando a mente vacilar em sua limitação, firma-nos na certeza da Tua obra perfeita."},
{"ref":"João 20:11-13","chapter":20,"quote":"Maria, entretanto, permanecia junto à entrada do túmulo, chorando. Enquanto chorava, abaixou-se, e olhou para dentro do túmulo, e viu dois anjos vestidos de branco, sentados onde o corpo de Jesus fora posto, um à cabeceira e outro aos pés. Então, eles lhe perguntaram: Mulher, por que choras? Ela lhes respondeu: Porque levaram o meu Senhor, e não sei onde o puseram.","commentary":"Há lágrimas que nascem do amor, mas ainda são atravessadas pela sombra da incompreensão. Maria permanece junto ao túmulo, chorando, e sua permanência já revela mais do que o seu entendimento alcança. O coração ferido ainda não discerniu plenamente a glória do Cristo Ressurreto, mas se recusa a afastar-se do lugar onde o Senhor fora posto. Enquanto chora, ela se abaixa, olha para dentro e vê \"dois anjos vestidos de branco\" [João 20:12], sentados onde antes estivera o corpo de Jesus. O céu já começou a responder, mesmo quando a alma ainda fala a linguagem da perda. A pergunta dos anjos não nasce de ignorância, mas de santa convocação: \"Mulher, por que choras?\" [João 20:13]. Maria ainda responde a partir da ausência: \"levaram o meu Senhor\" [João 20:13]. Contudo, o Salvador do Mundo já não pode ser definido pelo túmulo, pela pedra ou pelo pranto. Assim também acontece conosco: por vezes, o coração está cercado de sinais da Graça e, ainda assim, demora a reconhecer o triunfo do Cordeiro Imaculado. Mas o céu se inclina. A Graça visita. A verdade amanhece. O Cristo vivo transforma lágrimas em adoração.","prayer":"Ó Imaculado Cristo, Senhor vivo e eterno, diante de quem até as lágrimas humanas são vistas e pesadas com perfeita compaixão! Tu és o Salvador do Mundo, e nem o túmulo, nem o lamento, nem a noite puderam ocultar para sempre a glória da Tua ressurreição. Quando o coração estiver abatido e os olhos ainda não discernirem claramente a Tua obra, inclina-Te sobre nós com Tua misericórdia e revela, diante de nossos olhos, o soberano poder da Tua Graça. Que não sejamos governados pela linguagem da perda, mas pela verdade do Cristo vivo."},
{"ref":"João 20:14-15","chapter":20,"quote":"Tendo dito isto, voltou-se para trás e viu Jesus em pé, mas não reconheceu que era Jesus. Perguntou-lhe Jesus: Mulher, por que choras? A quem procuras? Ela, supondo ser ele o jardineiro, respondeu: Senhor, se tu o tiraste, dize-me onde o puseste, e eu o levarei.","commentary":"Nem sempre a presença de Cristo é imediatamente discernida por um coração ferido, porque a dor pode toldar os olhos sem apagar o amor que ainda O busca. Maria volta-se e vê Jesus em pé, vivo, próximo, presente; contudo, \"não reconheceu que era Jesus\" [João 20:14]. O Ressurreto já está diante dela, mas sua alma ainda interpreta a cena a partir da perda. Por isso, a voz do Senhor não apenas acolhe seu pranto, mas penetra mais fundo: \"A quem procuras?\" [João 20:15]. Esta é a pergunta que atravessa o lamento e toca o centro do coração. Maria pensa falar com o jardineiro, e sua resposta revela amor sincero, mas também discernimento incompleto: \"dize-me onde o puseste, e eu o levarei\" [João 20:15]. Assim também a alma, por vezes, ama verdadeiramente o Salvador do Mundo e, ainda assim, responde apressadamente, sem perceber que o próprio Cristo Glorioso já está presente e falando. Mas o Senhor não se afasta por causa da nossa limitação. Ele permanece em pé diante de nós. Ele nos interpela com mansidão. Ele conduz a busca à revelação. O Cristo vivo está mais perto do que a dor consegue perceber.","prayer":"Ó Cristo, Senhor vivo e glorioso, que permaneces diante dos Teus mesmo quando os olhos ainda não conseguem Te reconhecer! Tu és o Salvador do Mundo, presente em meio às lágrimas, paciente diante da nossa limitação e santo em Tua misericórdia. Quando a dor toldar o nosso discernimento e o coração responder sem clareza, não Te afastes de nós. Ensina-nos a ouvir-Te com reverência e a perceber-Te mesmo quando a tristeza ainda pesa sobre nós. Permanece diante de nós, ó Cristo vivo, até que todo o nosso ser Te reconheça e descanse em Tua santa voz."},
{"ref":"João 20:16-18","chapter":20,"quote":"Disse-lhe Jesus: Maria! Ela, voltando-se, lhe disse, em hebraico: Raboni (que quer dizer Mestre)! Recomendou-lhe Jesus: Não me detenhas; porque ainda não subi para meu Pai, mas vai ter com os meus irmãos e dize-lhes: Subo para meu Pai e vosso Pai, para meu Deus e vosso Deus. Então, saiu Maria Madalena anunciando aos discípulos: Vi o Senhor! E contava que ele lhe dissera estas coisas.","commentary":"Bastou que o Cristo vivo pronunciasse um nome para que toda a penumbra da alma se desfizesse diante da luz da revelação. Maria ouvira perguntas, vira anjos e contemplara o próprio Jesus em pé, mas somente quando o Mestre disse \"Maria!\" [João 20:16] é que o coração reconheceu aquilo que os olhos ainda não haviam discernido. O Verbo Eterno chama Suas ovelhas pelo nome, e, quando Ele fala, a confusão perde força, a dor cede lugar ao reconhecimento e a alma reencontra seu centro. O clamor \"Raboni\" não é apenas resposta afetiva, mas sinal de reencontro, rendição e reverência. Contudo, o Senhor prossegue instruindo: \"Não me detenhas\" [João 20:17]. O amor de Maria era verdadeiro, mas não poderia reter Cristo ao modo antigo de estar presente. Sem dúvida, na manhã da ressurreição, Ele foi visto por Maria. Contudo, Ele seguia rumo à plena glorificação junto ao Pai. Por isso, o chamado transforma a angústia em alegria, o abraço em missão, a saudade em testemunho. E aquela que chorava agora proclama: \"Vi o Senhor!\" [João 20:18]. A voz de Cristo dissipa a noite. A presença de Cristo redefine o amor. A missão de Cristo transforma o pranto em testemunho.","prayer":"Ó Cristo Glorioso e Sublime, Tu que chamas os Teus pelo nome e dissipas a penumbra do coração com a luz da Tua voz! Tu és o Verbo Eterno, vivo e exaltado em glória, exaltado em glória e perfeito em Tua obra. Que a Tua presença cure a nossa dor, que a Tua Palavra alinhe o nosso coração, e que a Tua missão se torne também a nossa alegria. Faz-nos sair do lamento para o anúncio, da saudade para a certeza, do silêncio para a confissão fiel."},
{"ref":"João 20:19-20","chapter":20,"quote":"Ao cair da tarde daquele dia, o primeiro da semana, trancadas as portas da casa onde estavam os discípulos com medo dos judeus, veio Jesus, pôs-se no meio e disse-lhes: Paz seja convosco! E, dizendo isto, lhes mostrou as mãos e o lado. Alegraram-se, portanto, os discípulos ao verem o Senhor.","commentary":"Portas trancadas não impedem a entrada do Cristo Ressurreto, porque nenhum medo humano é capaz de barrar a presença soberana do Senhor da vida. Os discípulos estão recolhidos, cercados por temor, tentando preservar-se num ambiente fechado, enquanto o peso da morte recente ainda paira sobre a alma. Contudo, o texto resplandece com santa simplicidade: \"veio Jesus, pôs-se no meio\" [João 20:19]. O Cristo Glorioso não fala à distância, não consola de longe, não visita apenas os mais fortes; Ele se coloca no centro do medo humano e pronuncia Sua paz. \"Paz seja convosco!\" Essa não é uma mera saudação, mas dom dos céus, palavra eficaz, anúncio de reconciliação e descanso. Em seguida, o Senhor lhes mostra \"as mãos e o lado\" [João 20:20]. A paz que Ele concede não ignora a cruz; ela nasce precisamente do sacrifício do Cordeiro Imaculado. As marcas permanecem, não como sinais de derrota, mas como selo da redenção consumada. E os que estavam dominados pelo medo agora se alegram ao ver o Senhor. Quando Cristo se põe no meio, o pavor perde o trono. A paz desce. A alegria floresce. O Senhor vivo reina.","prayer":"Ó Príncipe da Paz, Senhor ressurreto, que atravessas nossas portas fechadas e Te pões no meio do nosso temor! Tu és o Cristo vivo, cujas mãos feridas e lado aberto proclamam a reconciliação que jamais poderíamos conquistar por nós mesmos. Quando a alma estiver sitiada pelo medo e o coração se esconder em seus recintos trancados, vem outra vez e derrama sobre nós a Tua paz soberana. Faz florescer em nós a alegria santa de quem Te vê pela fé e descansa em Tua vitória."},
{"ref":"João 20:21","chapter":20,"quote":"Disse-lhes, pois, Jesus outra vez: Paz seja convosco! Assim como o Pai me enviou, eu também vos envio.","commentary":"A paz que Cristo concede jamais é repouso estéril; ela sempre prepara o coração para a santa vocação daqueles que foram alcançados por Sua presença. O Senhor Ressurreto repete aos discípulos a mesma palavra que desfaz o medo e aquieta a alma: \"Paz seja convosco!\" [João 20:21]. Porém, dessa vez, a paz não vem sozinha. Ela vem acompanhada de envio, propósito e missão. O Cristo Glorioso não reúne os Seus apenas para consolá-los, mas para consagrá-los. \"Assim como o Pai me enviou, eu também vos envio\" [João 20:21]. Os discípulos são enviados não segundo seus próprios impulsos, nem em nome de suas preferências, mas sob o modelo do envio do Filho pelo Pai. Trata-se de uma missão na qual o testemunho do Cordeiro será continuado pelos discípulos. O Salvador do Mundo comunica aos Seus uma missão marcada por obediência, dependência, verdade e amor. A paz de Cristo não nos retira do mundo para a inércia; ela nos envia ao mundo para testemunhar. Quem foi visitado pela paz do Cristo Ressurreto não pode viver para si mesmo. A paz envia. A graça comissiona. O Cristo vivo faz de servos testemunhas.","prayer":"Ó Imaculado Cordeiro de Deus, Tu és o Cristo vivo, perfeito em todas as Tuas obras, santo em verdade e glorioso em Teu envio. Ensina-nos a compreender que toda verdadeira comunhão contigo também nos impele ao testemunho do Teu nome. Livra-nos de uma fé sem vocação, de um consolo sem serviço e de uma devoção sem missão. Que o nosso coração seja aquietado por Tua paz e, ao mesmo tempo, despertado para a Tua obra."},
{"ref":"João 20:22-23","chapter":20,"quote":"E, havendo dito isto, soprou sobre eles e disse-lhes: Recebei o Espírito Santo. Se de alguns perdoardes os pecados, são-lhes perdoados; se lhos retiverdes, são retidos.","commentary":"O sopro do Cristo Ressurreto não apenas consola os Seus, mas inaugura uma nova existência e consagra os Seus para uma santa missão. Depois da paz pronunciada sobre os discípulos, o Senhor realiza um gesto carregado de majestade e memória: \"soprou sobre eles\" [João 20:22]. O mesmo Deus que no princípio deu fôlego ao homem, agora, em Cristo, comunica vida espiritual ao Seu povo e assinala o início da nova criação. \"Recebei o Espírito Santo\" não é simples palavra de encorajamento, mas sinal de capacitação, presença divina e envio santo. O Cristo Glorioso não reúne os Seus apenas para lhes dar abrigo; Ele os estabelece como testemunhas de Sua obra redentora. A declaração acerca do perdão dos pecados manifesta a seriedade da missão da igreja em anunciar o evangelho que absolve os que creem e confirma a culpa que recai sobre os que rejeitam a Graça. O Senhor Ressurreto sopra, envia e confia aos Seus a palavra da reconciliação. Onde o Espírito do Senhor é recebido, nasce vida. Onde o evangelho é fielmente anunciado, o perdão é proclamado. Onde Cristo reina, uma nova criação começa.","prayer":"Ó Cristo Eterno e Glorioso, Tu que sopras vida sobre os Teus e comunicas o Teu Espírito com santa autoridade! Tu és o Majestoso Senhor, fonte do verdadeiro fôlego da alma, e somente em Ti a nossa aridez se converte em vida, paz e vocação. Sopra também sobre nós neste dia, e livra-nos de toda esterilidade espiritual, de toda frieza do coração e de toda hesitação diante da Tua vontade. Que os nossos lábios jamais se calem diante da palavra da reconciliação, e que a nossa vida testemunhe, com humildade e verdade, o perdão que flui da Tua obra redentora."},
{"ref":"João 20:24-25","chapter":20,"quote":"Ora, Tomé, um dos doze, chamado Dídimo, não estava com eles quando veio Jesus. Disseram-lhe, então, os outros discípulos: Vimos o Senhor. Mas ele respondeu: Se eu não vir nas suas mãos o sinal dos cravos, e ali não puser o dedo, e não puser a mão no seu lado, de modo algum acreditarei.","commentary":"Há perdas espirituais que nascem quando a alma se ausenta justamente do lugar onde o Senhor visita o Seu povo com paz, presença e revelação. Tomé não estava com os demais quando Jesus veio, e essa ausência o privou, naquele primeiro momento, da alegria santa que encheu os discípulos ao contemplarem o Cristo Ressurreto. Ainda assim, a comunhão dos irmãos não o abandona; eles lhe anunciam com simplicidade e firmeza: \"Vimos o Senhor\" [João 20:25]. Mas Tomé, ferido pela exigência de certeza palpável, ergue diante do testemunho recebido a barreira de suas condições: \"de modo algum acreditarei\" [João 20:25]. O coração humano, por vezes, deseja submeter o agir do Salvador do Mundo ao tribunal dos próprios critérios. Quer tocar antes de confiar. Quer medir antes de render-se. Quer verificar antes de adorar. No entanto, o Cristo Ressurreto não deixa de ser verdadeiro mesmo quando a incredulidade insiste em seus próprios termos. As marcas em Suas mãos e em Seu lado não são apenas provas para os hesitantes; são sinais da obra consumada do Cordeiro Imaculado. A ausência de Tomé é sinal da sua dúvida. O convite dos discípulos é um testemunho da força da comunidade. Cristo permanece fiel. Cristo permanece vivo. Cristo vence até a incredulidade.\n\nSejas para sempre louvado, ó Maravilhoso Jesus, pois Tu permaneces verdadeiro mesmo quando o coração humano vacila sob o peso das dúvidas! Tu és o Cristo vivo, e as feridas da Tua paixão resplandecem como sinais eternos da redenção consumada. Quando a incredulidade quiser enfraquecer as nossas convicções, inclina o nosso coração à reverência e à fé. Não permitas que nos ausentemos da comunhão onde Tua paz é anunciada e Tua presença é celebrada.","prayer":""},
{"ref":"João 20:26","chapter":20,"quote":"Passados oito dias, estavam outra vez ali reunidos os seus discípulos, e Tomé, com eles. Estando as portas trancadas, veio Jesus, pôs-se no meio e disse-lhes: Paz seja convosco!","commentary":"A Graça de Cristo não apenas visita os reunidos; ela também sabe retornar, em santa misericórdia, ao encontro daquele que antes se perdera na sua ausência. Oito dias depois, os discípulos estão outra vez reunidos, e agora Tomé está com eles. Aquele que antes não ouvira dos próprios lábios do Salvador Ressurreto a palavra de paz, desta vez se encontra no lugar da comunhão, no espaço onde o Senhor se manifesta ao Seu povo. Mais uma vez, \"veio Jesus, pôs-se no meio\" [João 20:26]. As portas continuam trancadas, mas a presença do Cristo Glorioso continua soberana sobre toda barreira humana. O medo ainda tenta cercar o ambiente, porém já não determina o centro da cena. O centro pertence ao Salvador do Mundo, que se coloca no meio dos Seus e repete a mesma palavra que desfaz o tumulto da alma: \"Paz seja convosco!\" [João 20:26]. Tomé agora escuta com os próprios ouvidos aquilo que antes lhe chegara apenas pelo testemunho dos irmãos. Assim também o Senhor age conosco: Ele nos chama de volta ao ajuntamento santo, confronta nossa ausência com Sua fidelidade e faz da comunhão o lugar de encontro com Sua paz. Cristo se manifesta. Cristo fala. Cristo restaura no meio da congregação.","prayer":"Ó Senhor ressurreto, fiel e pleno em misericórdia, ensina-nos a discernir a Tua presença no meio da congregação! Tu és o Cristo vivo, diante de quem portas trancadas não resistem e corações vacilantes podem ser restaurados. Guarda-nos de toda negligência para com a comunhão do Teu povo, e faz-nos amar o lugar onde Tua voz é ouvida e Tua paz é derramada. Dá-nos discernimento para não desprezarmos o testemunho dos irmãos, nem nos ausentarmos do lugar onde o Tu visita os Teus."},
{"ref":"João 20:27-29","chapter":20,"quote":"E logo disse a Tomé: Põe aqui o dedo e vê as minhas mãos; chega também a mão e põe-na no meu lado; não sejas incrédulo, mas crente. Respondeu-lhe Tomé: Senhor meu e Deus meu! Disse-lhe Jesus: Porque me viste, creste? Bem-aventurados os que não viram e creram.","commentary":"A misericórdia de Cristo sabe confrontar a incredulidade sem esmagar o discípulo, conduzindo a alma vacilante da névoa da dúvida à mais alta confissão de fé. Jesus Se dirige logo a Tomé e responde, com santa precisão, às palavras duras que antes haviam revelado sua resistência: \"Põe aqui o dedo e vê as minhas mãos\" [João 20:27]. O Senhor Ressurreto não ignora a fraqueza do discípulo, mas também não a afaga como virtude. Ele a expõe à luz da Sua presença e ordena: \"não sejas incrédulo, mas crente\" [João 20:27]. Diante dessa revelação, a névoa se dissipa, e Tomé profere uma das mais sublimes declarações de todo o Evangelho: \"Senhor meu e Deus meu!\" [João 20:28]. O Cristo Glorioso não é apenas Mestre restaurado, mas o próprio Deus entre os homens, digno de rendição, adoração e entrega. Ainda assim, o Senhor eleva o olhar para além de Tomé e alcança todos os que viriam depois: \"Bem-aventurados os que não viram e creram\" [João 20:29]. A fé cristã não repousa na incredulidade satisfeita, mas na confiança rendida à Palavra Viva. Cristo corrige. Cristo revela. Cristo faz brotar adoração onde antes havia incredulidade.","prayer":"Ó Senhor meu e Deus meu, Tu és o Cristo vivo, diante de quem toda incredulidade é desfeita e toda alma sincera é chamada à rendição! Tu és a Palavra Viva, verdadeira em Tuas promessas, gloriosa em Tua presença e santa em Tuas correções. Não permitas que a dúvida governe o nosso coração; antes, confronta-nos com a luz da Tua verdade e conduze-nos pelos caminhos da Tua fidelidade."},
{"ref":"João 20:30-31","chapter":20,"quote":"Na verdade, fez Jesus diante dos discípulos muitos outros sinais que não estão escritos neste livro. Estes, porém, foram registrados para que creiais que Jesus é o Cristo, o Filho de Deus, e para que, crendo, tenhais vida em seu nome.","commentary":"Os sinais de Cristo jamais foram espetáculo para curiosos; sempre foram testemunhos santos destinados a conduzir o coração à fé e a alma à vida. O evangelista declara que Jesus realizou \"muitos outros sinais\" [João 20:30], mas faz também uma escolha inspirada: nem tudo foi escrito. O que foi registrado neste santo Evangelho não o foi para satisfazer a imaginação humana, mas para revelar o centro da verdade divina. \"Estes, porém, foram registrados para que creiais\" [João 20:31]. Os sinais, portanto, não são fim em si mesmos. Eles apontam para Alguém maior que o prodígio: Jesus, o Cristo, o Filho de Deus. O Verbo Eterno não se manifesta para entreter os sentidos, mas para despertar fé verdadeira, render o coração e comunicar vida em Seu nome. É por isso que os sinais foram feitos diante dos discípulos: eles não apenas assistiram aos feitos do Salvador do Mundo, mas tornaram-se testemunhas autorizadas da glória que contemplaram. Assim, o Evangelho segundo João é um livro de fé, de revelação e de vida. Quem lê com humildade encontra mais que narrativa; encontra chamado. Quem crê encontra mais que compreensão; encontra vida. Cristo é o sinal supremo. Cristo é o Filho eterno. Cristo é a vida dos que creem.","prayer":"Ó Filho de Deus, Cristo eterno e verdadeiro, Tu és o centro de todos os sinais e a fonte da vida que jamais perece! Tu és o Verbo Vivo, revelado para que a nossa alma creia, e, crendo, participe da plenitude da Tua vida. Guarda-nos de buscar os Teus feitos apenas com curiosidade passageira, e inclina o nosso coração à fé sincera, reverente e perseverante."},
{"ref":"João 21:1-2","chapter":21,"quote":"Depois disto, tornou Jesus a manifestar-se aos discípulos junto do mar de Tiberíades; e foi assim que ele se manifestou: estavam juntos Simão Pedro, Tomé, chamado Dídimo, Natanael, que era de Caná da Galileia, os filhos de Zebedeu e mais dois dos seus discípulos.","commentary":"O Cristo ressuscitado não abandona os Seus no intervalo entre a promessa e a missão; Ele os encontra no lugar comum, com a glória discreta de quem reina sobre todas as coisas. João abre o epílogo mostrando que a iniciativa é sempre do Senhor: \"tornou Jesus a manifestar-se aos discípulos junto do mar de Tiberíades\" João 21:1-2. Não são os discípulos que arrancam uma visão do céu; é o Cristo Glorioso quem Se dá a conhecer, por graça soberana, aos corações ainda frágeis. Pedro está ali, marcado pela queda. Tomé está ali, recém-conduzido da dúvida à confissão. Natanael está ali, testemunha antiga da promessa. Os filhos de Zebedeu e os outros discípulos estão ali, reunidos não pela força de sua própria constância, mas pela fidelidade dAquele que os chama. O mar de Tiberíades torna-se altar de revelação: o cotidiano é visitado pelo Eterno, a memória é preparada para a restauração, a comunhão é reunida ao redor do Senhor vivo. A alma aprende a esperar sem presunção e a reconhecer que toda aparição salvadora nasce da vontade do Salvador. Cristo vem. Cristo revela. Cristo permanece.","prayer":"Ó Cristo Glorioso, Senhor vivo e Soberano, Tu Te manifestas a nós no cotidiano das nossas fragilidades e temores! Tu sempre está conosco, ainda que a nossa comunhão se ache enfraquecida pelo medo, pela dúvida e pela inconstância da nossa piedade. Dá-nos olhos reverentes para discernir Tua presença nas horas simples, coração humilde para acolher Tua iniciativa em nos encontrar e fé serena para descansar na fidelidade do Teu cuidado."},
{"ref":"João 21:3-4","chapter":21,"quote":"Disse-lhes Simão Pedro: Vou pescar. Disseram-lhe os outros: Também nós vamos contigo. Saíram, e entraram no barco, e, naquela noite, nada apanharam. Mas, ao clarear da madrugada, estava Jesus na praia; todavia, os discípulos não reconheceram que era ele.","commentary":"Há ocasiões em que o fracasso se torna o sino secreto da Graça, chamando a alma de volta à presença do Senhor. Quando Pedro diz: \"Vou pescar\" João 21:3-4, o texto não declara, de modo absoluto, que ele abandonara seu chamado; contudo a cena carrega o peso de homens ainda confusos, voltando ao barco à noite para pescar. A pescaria não é desobediência em si, mas, à parte de Cristo, até a experiência mais antiga se torna estéril. Eles saíram, entraram no barco e \"naquela noite, nada apanharam\" [João 21:3-4]. A noite revela a insuficiência humana. O barco revela a fragilidade da autoconfiança. A rede vazia revela que nenhum labor frutifica sem a bênção do Soberano Rei. Mas a madrugada traz uma misericórdia maior que o cansaço: \"estava Jesus na praia\" [João 21:3-4]. Antes que eles O reconhecessem, Ele já os esperava. Antes da restauração pública, há a presença silenciosa do Cristo Ressuscitado. O fracasso não é o fim quando Cristo está à nossa espera. Ele acolhe. Ele chama. Ele restaura.","prayer":"Ó Cristo Glorioso, Senhor supremo sobre as horas escuras da vida, Tu nos encontras quando nossas redes estão vazias, quando a noite expõe nossa fraqueza e quando ainda não sabemos reconhecer Tua presença. Livra-nos de confiar em nossos próprios recursos, na força do nosso braço e na memória de nossas habilidades. Dá-nos coração humilde para reconhecer que o fracasso pode ser um chamado para retornarmos aos Teus caminhos, e olhos iluminados pela Tua Palavra para perceber que Tu sempre estarás à nossa espera."},
{"ref":"João 21:5-6","chapter":21,"quote":"Perguntou-lhes Jesus: Filhos, tendes aí alguma coisa de comer? Responderam-lhe: Não. Então, lhes disse: Lançai a rede à direita do barco e achareis. Assim fizeram e já não podiam puxar a rede, tão grande era a quantidade de peixes.","commentary":"A mesma voz que um dia chamou Pedro para deixar as redes agora o reencontra novamente entre elas, quando o chamado parecia encoberto pela confusão. Esse reencontro é poderoso para transformar desorientação em missão restaurada. Na praia, Jesus chama os discípulos de \"Filhos\" e, com a pergunta \"tendes aí alguma coisa de comer?\", Ele os conduz à verdade simples de sua insuficiência. Ao responderem \"Não\", eles reconhecem sua incapacidade. A confissão da rede vazia prepara o coração para a Palavra que governa o mar, o barco e a missão. A cena recorda a antiga pesca milagrosa: ali, Pedro foi chamado; aqui, Pedro começa a ser restaurado. Em ambas, o êxito não nasce da técnica dos pescadores, mas da autoridade do Cristo Glorioso. Quando Ele diz: \"Lançai a rede à direita do barco e achareis\", Ele abre o caminho para que a obediência encontre aquilo que a experiência não pôde produzir. A rede pesada torna-se testemunho da dependência: nada temos sem Ele, nada frutifica longe dEle, nada se perde quando Sua voz nos dirige. O coração aprende que a missão não é sustentada pela força daqueles que são chamados, mas pela presença soberana dAquele que chama. Cristo ordena. Cristo provê. Cristo restaura.","prayer":"Ó Cristo Glorioso, Palavra Viva que governa o mar e sustenta a missão dos Teus discípulos! Tu conheces nossas redes vazias antes mesmo que as confessemos, e ainda assim nos chamas com ternura, autoridade e graça. Ensina-nos a responder com humildade quando nada temos, e a obedecer com reverência quando Tua voz nos ordena lançar outra vez a rede. Enche-nos da dependência santa que glorifica Teu nome e submete toda pescaria ao Teu senhorio."},
{"ref":"João 21:7-8","chapter":21,"quote":"Aquele discípulo a quem Jesus amava disse a Pedro: É o Senhor! Simão Pedro, ouvindo que era o Senhor, cingiu-se com sua veste, porque se havia despido, e lançou-se ao mar; mas os outros discípulos vieram no barquinho puxando a rede com os peixes; porque não estavam distantes da terra senão quase duzentos côvados.","commentary":"O milagre verdadeiro não prende os olhos à rede cheia, mas os conduz ao Senhor que a encheu. Diante da abundância inesperada, o discípulo amado discerne mais que um acontecimento extraordinário; ele reconhece uma Presença: \"É o Senhor!\" [João 21:7-8]. A fé iluminada não transforma o sinal em espetáculo, mas em ponte para o Verbo Eterno, pois toda dádiva santa aponta para o Doador. E esse reconhecimento não permanece silencioso. Aquele que vê anuncia; aquele que anuncia desperta; aquele que ouve se move. Pedro, ao ouvir que era o Senhor, cinge-se e lança-se ao mar. O mesmo homem que antes conhecera o medo das águas agora atravessa o mar movido por uma afeição maior que o temor. A rede cheia permanece com os demais, mas o coração de Pedro corre para Cristo. Há momentos em que a alma entende que a bênção é preciosa, mas o Abençoador é incomparavelmente maior. O mar já não governa Pedro. O milagre já não o detém. A vergonha já não o paralisa. Cristo está adiante. Cristo atrai. Cristo basta.","prayer":"Ó Salvador Eterno, doador dos dons mais preciosos, dá-nos olhos capazes de perceber a Tua presença sem transformar Teus milagres no fim último do nosso coração. Que a imensidão dos dons que recebemos de Ti acenda em nós uma santa coragem, para que nenhum medo, nenhuma vergonha e nenhuma água profunda nos impeçam de correr para Tua presença. Ensina-nos a Te exaltar pela dádiva sem perder de vista o Doador."},
{"ref":"João 21:9-10","chapter":21,"quote":"Ao saltarem em terra, viram ali umas brasas e, em cima, peixes; e havia também pão. Disse-lhes Jesus: Trazei alguns dos peixes que acabastes de apanhar.","commentary":"A Graça de Cristo não apenas provê antes de nós, mas também dignifica aquilo que Ele mesmo nos capacita a trazer. Ao saltarem em terra, os discípulos encontram brasas, peixes e pão; antes que sua rede chegasse à praia, o Salvador do Mundo já havia preparado a mesa. O Senhor não depende da pescaria dos homens para alimentar os Seus, pois \"viram ali umas brasas e, em cima, peixes; e havia também pão\" [João 21:9-10]. Contudo, Ele diz: \"Trazei alguns dos peixes que acabastes de apanhar\" [João 21:9-10]. Aqui resplandece uma delicada misericórdia: Cristo provê tudo, mas concede aos Seus servos o privilégio de participar daquilo que Sua própria palavra tornou possível. A contribuição humana não nasce de autonomia, mérito ou suficiência; nasce da Graça que chama, dirige, frutifica e depois acolhe os frutos na mesa do Mestre. O coração aprende que servir não é completar o que falta em Cristo, mas oferecer de volta aquilo que dEle recebemos. Ele prepara o pão. Ele concede os peixes. Ele recebe nossa pequena oferta. Cristo provê. Cristo inclui. Cristo consagra.","prayer":"Ó Mestre generoso, que preparas brasas, peixes e pão antes mesmo que cheguemos à praia! Tu és suficiente em Ti mesmo, e ainda assim nos concedes o santo privilégio de participar da obra que Tua Palavra realiza. Livra-nos de toda presunção, para que nunca tratemos nossos frutos como conquista própria; ensina-nos a trazer diante de Ti aquilo que Tu mesmo nos fizeste colher, reconhecendo que tudo veio de Tua voz, de Tua providência e de Teu poder. Recebe nossa obediência, purifica nossas mãos e consagra cada fruto à glória do Teu nome."},
{"ref":"João 21:11-12","chapter":21,"quote":"Simão Pedro entrou no barco e arrastou a rede para a terra, cheia de cento e cinquenta e três grandes peixes; e, não obstante serem tantos, a rede não se rompeu. Disse-lhes Jesus: Vinde, comei. Nenhum dos discípulos ousava perguntar-lhe: Quem és tu? Porque sabiam que era o Senhor.","commentary":"A rede que não se rompe anuncia que a Graça de Cristo sustenta aquilo que a Sua própria voz reúne. Pedro entra no barco e arrasta para a terra a rede cheia de \"cento e cinquenta e três grandes peixes\" [João 21:11-12]. O milagre não está apenas na abundância da pescaria, mas também na resistência da rede: \"não obstante serem tantos, a rede não se rompeu\" [João 21:11-12]. O Cristo Glorioso não apenas chama, dirige e provê; Ele também preserva o fruto que concede. A missão dos discípulos não repousa na força da rede, nem na habilidade de Pedro, mas na soberania do Senhor que torna possível o que seria impossível. Em seguida, a voz que governa o mar torna-se convite de comunhão: \"Vinde, comei\" [João 21:11-12]. O Mestre que enche as redes prepara também a mesa. E, diante dEle, perguntas desnecessárias se calam. Não há necessidade de perguntar \"Quem és tu?\", pois \"sabiam que era o Senhor\" [João 21:11-12]. Há uma certeza que nasce não da curiosidade, mas da presença. A alma reconhece, descansa e se achega. Cristo reúne. Cristo sustenta. Cristo alimenta.","prayer":"Ó Cristo Glorioso, Senhor da rede que não se rompe e da mesa que nos acolhe! Tu és Aquele que chama os Teus, dirige a pescaria, preserva o fruto e convida à comunhão. Livra-nos de confiar na força da rede, na habilidade das mãos ou na segurança dos números, pois a verdadeira provisão vem de Tuas mãos. Conduze-nos à mesa da Tua Graça, alimenta nossa alma cansada e sustenta a nossa fidelidade sob a luz do Teu poder."},
{"ref":"João 21:13-14","chapter":21,"quote":"Veio Jesus, tomou o pão, e lhes deu, e, de igual modo, o peixe. E já era esta a terceira vez que Jesus se manifestava aos discípulos, depois de ressuscitado dentre os mortos.","commentary":"Aquele que é digno de ser servido inclina-Se, em Graça, para servir os Seus à mesa. Jesus vem, toma o pão e o reparte; de igual modo, oferece o peixe. O Cristo Glorioso, vencedor da morte, não manifesta Sua majestade afastando-Se dos discípulos, mas aproximando-Se deles com ternura santa. A mão que venceu o sepulcro agora distribui pão; o Senhor que reina sobre a vida alimenta os que ainda precisam ser restaurados. João acrescenta: \"E já era esta a terceira vez que Jesus se manifestava aos discípulos\" [João 21:13-14]. O verbo manifestar carrega a ideia de tornar visível, revelar, fazer aparecer aquilo que estava oculto aos olhos. Não se trata de lembrança vaga, impressão interior ou consolo imaginado; é o Ressuscitado apresentando-Se aos Seus como presença real, viva e vitoriosa. \"Depois de ressuscitado dentre os mortos\" [João 21:13-14], Ele Se dá a conhecer no pão, no peixe, na mesa e na comunhão. A alma aprende que a ressurreição não é doutrina distante, mas presença que serve, sustenta e reúne. Cristo vive. Cristo serve. Cristo se manifesta.","prayer":"Ó Majestoso Jesus, Ressuscitado dentre os mortos e Senhor soberano que Te assentas à mesa com os discípulos! Tu venceste a morte, e ainda assim Te aproximas com pão nas mãos e misericórdia no olhar. Manifesta-Te a nós pela Tua Palavra Viva, para que não vivamos de lembranças vagas, mas da certeza santa da Tua presença conosco. Alimenta nossa fé cansada, restaura nossa comunhão enfraquecida e ensina-nos a viver com esperança e reverente adoração."},
{"ref":"João 21:15-16","chapter":21,"quote":"Depois de terem comido, perguntou Jesus a Simão Pedro: Simão, filho de João, amas-me mais do que estes outros? Ele respondeu: Sim, Senhor, tu sabes que te amo. Ele lhe disse: Apascenta os meus cordeiros. Tornou a perguntar-lhe pela segunda vez: Simão, filho de João, tu me amas? Ele lhe respondeu: Sim, Senhor, tu sabes que te amo. Disse-lhe Jesus: Pastoreia as minhas ovelhas.","commentary":"O amor que Cristo requer não se limita a uma emoção envolvente, mas floresce em cuidado pastoral, especialmente para com o rebanho que pertence a Ele. Depois da refeição, Jesus Se volta a Pedro e toca o centro de sua restauração: \"Simão, filho de João, amas-me mais do que estes outros?\" [João 21:15-16]. O chamado não começa pela habilidade, pela coragem ou pela memória de antigas promessas; começa pelo amor ao Senhor. Pedro responde: \"Sim, Senhor, tu sabes que te amo\" [João 21:15-16]. Então o Mestre une afeição e missão: \"Apascenta os meus cordeiros\" [João 21:15-16]. Na segunda pergunta, a mesma verdade ressoa: \"tu me amas?\", e a mesma Graça comissiona: \"Pastoreia as minhas ovelhas\" [João 21:15-16]. O rebanho não pertence a Pedro, mas ao Cristo Glorioso; por isso, todo cuidado pastoral deve nascer do amor a Cristo. Aquele que ama submete-se à voz de Cristo e serve aos que são Dele. Amar o Mestre da vida é cuidar de Suas ovelhas. Amor confessado. Amor provado. Amor compartilhado.","prayer":"Quão majestoso és, ó Cordeiro Imaculado, Supremo Pastor das ovelhas e Senhor que sondas o amor dos Teus servos! Tu conheces o coração antes da resposta, a fraqueza antes do arrependimento e a vocação antes do serviço. Ensina-nos a Te amar com verdade genuína, sem presunção, sem comparação e sem superficialidade. Purifica nossa afeição, restaura nossa obediência e faze-nos servir o Teu rebanho com ternura, zelo e reverência."},
{"ref":"João 21:17","chapter":21,"quote":"Pela terceira vez Jesus lhe perguntou: Simão, filho de João, tu me amas? Pedro entristeceu-se por ele lhe ter dito, pela terceira vez: Tu me amas? E respondeu-lhe: Senhor, tu sabes todas as coisas, tu sabes que eu te amo. Jesus lhe disse: Apascenta as minhas ovelhas.","commentary":"A pergunta que entristece Pedro é também o bisturi da Graça que alcança o lugar mais profundo do seu amor ferido. Pela terceira vez, Jesus pergunta: \"Simão, filho de João, tu me amas?\" [João 21:17]. A repetição não é crueldade, mas restauração; não expõe para destruir, mas sonda para curar. Pedro entristece-se, talvez porque a tríplice pergunta lhe recorde a tríplice negação, mas agora sua resposta já não se apoia na força de promessas humanas. Ele se entrega ao conhecimento absoluto do Messias Onisciente: \"Senhor, tu sabes todas as coisas, tu sabes que eu te amo\" [João 21:17]. O olhar de Cristo penetra o âmago da alma, distingue presunção de afeição verdadeira e conhece o amor frágil que ainda pulsa sob as cinzas do nosso frágil coração. E, depois de sondar, o Cordeiro Soberano comissiona: \"Apascenta as minhas ovelhas\" [João 21:17]. A tristeza de Pedro não termina em vergonha estéril, mas em serviço restaurado. O amor conhecido por Cristo torna-se cuidado por Suas ovelhas. Ele sonda. Ele cura. Ele envia.","prayer":"Ó Messias Onisciente, Cordeiro Soberano que sondas todas as coisas e conheces o amor frágil que ainda pulsa sob a fragilidade do nosso coração! Tu vês o que há no âmago da alma, percebes nossas quedas sem desprezar nossa afeição e transformas tristeza em restauração. Comissiona-nos novamente por Tua Graça, para que cuidemos do que pertence a Ti. Sonda-nos, restaura-nos e envia-nos para a glória do Teu nome."},
{"ref":"João 21:18-19","chapter":21,"quote":"Em verdade, em verdade te digo que, quando eras mais moço, tu te cingias a ti mesmo e andavas por onde querias; quando, porém, fores velho, estenderás as mãos, e outro te cingirá e te levará para onde não queres. Disse isto para significar com que gênero de morte Pedro havia de glorificar a Deus. Depois de assim falar, acrescentou-lhe: Segue-me.","commentary":"O chamado de Cristo não se limita ao início da vida cristã; ele atravessa toda a trajetória do discípulo até que a morte se torne altar para a glória de Deus. Jesus anuncia a Pedro um futuro que ele não escolheria por si mesmo: \"quando, porém, fores velho, estenderás as mãos, e outro te cingirá e te levará para onde não queres\" [João 21:18-19]. A juventude de Pedro fora marcada por iniciativa, força e caminhos próprios; sua velhice seria marcada por rendição, dependência e entrega. O evangelista João interpreta a palavra do Mestre: \"Disse isto para significar com que gênero de morte Pedro havia de glorificar a Deus\" [João 21:18-19]. Assim, o Cristo Glorioso não apenas restaura Pedro para viver, mas o chama a morrer de modo que Deus seja exaltado. No primeiro encontro, Pedro ouviu o chamado para deixar as redes; agora, diante do Cristo Ressuscitado, ele ouve novamente a palavra essencial: \"Segue-me\" [João 21:18-19]. A vocação cristã não é domínio sobre o próprio destino, mas comunhão obediente com o Senhor. Seguir é pertencer. Seguir é render-se. Seguir é glorificar.","prayer":"Ó Cristo Glorioso, Tu conheces os caminhos que não escolheríamos, as renúncias que tememos e as entregas pelas quais Teu nome será exaltado. Ensina-nos a seguir-Te não apenas quando a obediência coincide com nossos desejos, mas também quando Tua vontade nos conduz para onde não queremos ir. Livra-nos da ilusão de governar a própria vida e concede-nos a graça de pertencer inteiramente a Ti. Que nossa força seja rendida, nossos caminhos sejam consagrados e nosso fim glorifique o Deus vivo. Dá-nos fé humilde para ouvir Tua voz e seguir-Te até o fim."},
{"ref":"João 21:20-21","chapter":21,"quote":"Então, Pedro, voltando-se, viu que também o ia seguindo o discípulo a quem Jesus amava, o qual na ceia se reclinara sobre o peito de Jesus e perguntara: Senhor, quem é o traidor? Vendo-o, pois, Pedro perguntou a Jesus: E quanto a este?","commentary":"Há momentos em que o coração, mesmo restaurado, ainda precisa aprender que seguir a Cristo exige os olhos voltados para o próprio chamado, não para o caminho do outro. Depois de ouvir \"Segue-me\", Pedro se volta e vê o discípulo amado, aquele que \"na ceia se reclinara sobre o peito de Jesus\" [João 21:20-21]. O evangelista recorda sua proximidade com o Mestre e sua pergunta sobre o traidor, mostrando que ele também caminhava no rastro do Senhor. Então Pedro pergunta: \"E quanto a este?\" [João 21:20-21]. A pergunta revela uma inclinação comum à alma humana: após receber uma palavra sobre seu chamado pessoal, alguns olham de lado, medem destinos, comparam vocações, sondam aquilo que pertence unicamente a Cristo. O Soberano Rei chama cada servo com sabedoria própria. Há caminhos distintos, medidas distintas, tarefas distintas, mas um só Senhor diante de todos. A presença do outro discípulo não diminui o chamado de Pedro; apenas recorda que ninguém segue Cristo por comparação. O coração aprende a descansar na vontade do Mestre e a caminhar sob Sua voz. Cristo chama. Cristo governa. Cristo conduz.","prayer":"Ó Soberano Rei, autor supremo do chamado de cada um dos Seus servos! Livra-nos do olhar inquieto que se volta para o destino do outro, enquanto Tua voz nos chama à obediência fiel. Ensina-nos a seguir-Te sem comparação, sem curiosidade ansiosa e sem medir a nossa vocação pela história alheia. Dá-nos coração sereno para acolher o caminho que nos confiaste, olhos firmes em Ti e passos obedientes à Tua Palavra."},
{"ref":"João 21:22-23","chapter":21,"quote":"Respondeu-lhe Jesus: Se eu quero que ele permaneça até que eu venha, que te importa? Quanto a ti, segue-me. Então, se tornou corrente entre os irmãos o dito de que aquele discípulo não morreria. Ora, Jesus não dissera que tal discípulo não morreria, mas: Se eu quero que ele permaneça até que eu venha, que te importa?","commentary":"O discípulo que fixa os olhos no caminho do outro perde a clareza da voz que o chamou. Diante da pergunta de Pedro acerca do discípulo amado, Jesus responde com firmeza: \"que te importa? Quanto a ti, segue-me\" [João 21:22-23]. O Cristo Glorioso corrige o foco de Pedro e o reconduz ao centro do chamado pessoal. O Senhor não revela os destinos de Seus servos para alimentar comparações, mas conduz cada um segundo a sabedoria perfeita de Sua vontade. Enquanto Pedro deseja saber sobre o futuro do outro, Jesus insiste no essencial: \"Quanto a ti, segue-me\" [João 21:22-23]. O olhar voltado para o próximo pode servir à comunhão, ao cuidado e ao amor fraternal, mas torna-se perigoso quando alimenta comparações, rivalidades ou inquietações ministeriais. A Palavra do Mestre deve ser ouvida com reverência, evitando especulações sobre o ministério alheio. É a fidelidade ao chamado pessoal que manifesta a honra devida Àquele que chama. O coração amadurece quando aprende a descansar no chamado que recebeu. Cristo chama. Cristo corrige. Cristo conduz.","prayer":"Majestoso e Sublime Cristo, Tu conheces os caminhos de cada servo e o modo como cada um honra o chamado recebido! Livra-nos da inquietação que nasce da comparação e do desejo de sondar aquilo que pertence somente ao Teu governo. Ensina-nos a olhar para os irmãos com amor fraternal, jamais com rivalidades ou comparações entre ministérios. Que nossa alma permaneça fiel à Tua voz, obediente ao Teu chamado e satisfeita com o lugar que nos confiaste. Dá-nos coração reverente diante da Tua Palavra Viva e passos firmes no caminho que preparaste para nós."},
{"ref":"João 21:24-25","chapter":21,"quote":"Este é o discípulo que dá testemunho a respeito destas coisas e que as escreveu; e sabemos que o seu testemunho é verdadeiro. Há, porém, ainda muitas outras coisas que Jesus fez. Se todas elas fossem relatadas uma por uma, creio eu que nem no mundo inteiro caberiam os livros que seriam escritos.","commentary":"O testemunho fiel acerca de Cristo sempre reconhece que a grandeza do Salvador ultrapassa aquilo que as palavras conseguem conter. João encerra seu evangelho declarando: \"Este é o discípulo que dá testemunho a respeito destas coisas e que as escreveu\" [João 21:24-25]. O que foi registrado não nasceu de imaginação de um religioso, mas do testemunho daquele que viu, ouviu e caminhou com o Verbo Encarnado. E o evangelista acrescenta: \"sabemos que o seu testemunho é verdadeiro\" [João 21:24-25]. A verdade do evangelho repousa sobre a fidelidade daquele que contemplou a glória do Cristo Glorioso. Contudo, o próprio João reconhece os limites do registro humano diante da majestade infinita do Salvador do Mundo: \"Há, porém, ainda muitas outras coisas que Jesus fez\" [João 21:24-25]. Nenhum livro poderia conter plenamente a vastidão de Sua obra, a profundidade de Sua glória e a riqueza de Sua Graça. A narrativa do evangelho termina, mas Cristo permanece inesgotável. O coração reverente aprende que conhecer verdadeiramente a Jesus é também reconhecer que Sua plenitude ultrapassa toda descrição humana. Cristo é maior. Cristo é inesgotável. Cristo é eterno.","prayer":"Ó Verbo Eterno, Salvador do Mundo e Cristo Glorioso, Tu és a verdade fiel testemunhada pelos Teus servos e a plenitude que nenhuma palavra humana consegue esgotar. Dá-nos coração reverente diante da Tua grandeza e fé humilde para recebermos com gratidão aquilo que nos foi revelado em Tua Palavra Viva. Que jamais tratemos o Teu evangelho como relato comum, mas como testemunho santo acerca dAquele que venceu a morte e reina eternamente. Ó Majestoso Cristo, que a nossa alma permaneça maravilhada diante da infinita glória do Teu nome."}
];

// ─── STATE ───
const MIN_FS = 14, MAX_FS = 28, DEFAULT_FS = 20;
let currentFontSize = parseInt(localStorage.getItem('om_fs') || DEFAULT_FS);
let currentChapter = 0; // 0 = all
let searchTerm = '';

// ─── FONT SIZE ───
function applyFontSize() {
  document.documentElement.style.setProperty('--fs', currentFontSize + 'px');
}
function changeFontSize(delta) {
  currentFontSize = Math.min(MAX_FS, Math.max(MIN_FS, currentFontSize + delta));
  applyFontSize();
  localStorage.setItem('om_fs', currentFontSize);
}
applyFontSize();

// ─── CHAPTERS ───
const chapters = [...new Set(DATA.map(p => p.chapter))].sort((a,b) => a-b);

function buildTabs() {
  const container = document.getElementById('tabs');
  // "Todos" button
  const allBtn = document.createElement('button');
  allBtn.className = 'tab-btn' + (currentChapter === 0 ? ' active' : '');
  allBtn.textContent = 'Todos';
  allBtn.onclick = () => selectChapter(0);
  container.appendChild(allBtn);

  chapters.forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (currentChapter === ch ? ' active' : '');
    btn.textContent = 'Jo ' + ch;
    btn.dataset.chapter = ch;
    btn.onclick = () => selectChapter(ch);
    container.appendChild(btn);
  });
}

function selectChapter(ch) {
  currentChapter = ch;
  searchTerm = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchCount').textContent = '';
  
  // Update tab styles
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const btnCh = btn.dataset.chapter ? parseInt(btn.dataset.chapter) : 0;
    btn.classList.toggle('active', btnCh === ch);
  });

  renderPericopes();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// ─── SEARCH ───
function onSearch() {
  searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
  currentChapter = 0;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const btnCh = btn.dataset.chapter ? parseInt(btn.dataset.chapter) : 0;
    btn.classList.toggle('active', btnCh === 0);
  });
  renderPericopes();
}

// ─── RENDER ───
function esc(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function formatText(text) {
  if (!text) return '';
  return text.split('\n\n').map(p => '<p>' + esc(p.trim()) + '</p>').join('');
}

function renderPericopes() {
  const container = document.getElementById('main');
  
  let items = DATA;
  
  if (currentChapter > 0) {
    items = items.filter(p => p.chapter === currentChapter);
  }
  
  if (searchTerm) {
    items = items.filter(p =>
      p.ref.toLowerCase().includes(searchTerm) ||
      p.quote.toLowerCase().includes(searchTerm) ||
      p.commentary.toLowerCase().includes(searchTerm) ||
      p.prayer.toLowerCase().includes(searchTerm)
    );
    document.getElementById('searchCount').textContent = items.length + ' resultado' + (items.length !== 1 ? 's' : '');
  } else {
    document.getElementById('searchCount').textContent = '';
  }
  
  if (items.length === 0) {
    container.innerHTML = '<div class="empty-state">Nenhuma perícope encontrada.</div>';
    return;
  }
  
  let html = '';
  let lastChapter = -1;
  
  items.forEach(p => {
    if (!searchTerm && p.chapter !== lastChapter) {
      html += '<div class="chapter-heading">João — Capítulo ' + p.chapter + '</div>';
      lastChapter = p.chapter;
    }
    
    html += '<article class="pericope">';
    html += '<span class="ref-tag">' + esc(p.ref) + '</span>';
    
    if (p.quote) {
      html += '<blockquote class="quote-block">' + esc(p.quote) + '</blockquote>';
    }
    
    if (p.commentary) {
      html += '<div class="commentary">' + formatText(p.commentary) + '</div>';
    }
    
    if (p.prayer) {
      html += '<div class="prayer-block">';
      html += '<span class="prayer-label">Oração</span>';
      html += formatText(p.prayer);
      html += '</div>';
    }
    
    html += '<p class="author">— A. M. Cunha</p>';
    html += '</article>';
  });
  
  container.innerHTML = html;
}

// ─── INIT ───
buildTabs();
renderPericopes();
</script>
</body>
</html>
